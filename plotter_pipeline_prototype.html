  <script>
    const NS = "http://www.w3.org/2000/svg";

    let gid = 1;
    function getGid() {
      return gid++;
    }

    // Seeded PRNG stuff
    function cyrb128(str) {
      let h1 = 1779033703, h2 = 3144134277,
          h3 = 1013904242, h4 = 2773480762;
      for (let i = 0, k; i < str.length; i++) {
          k = str.charCodeAt(i);
          h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
          h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
          h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
          h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
      }
      h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
      h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
      h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
      h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
      h1 ^= (h2 ^ h3 ^ h4), h2 ^= h1, h3 ^= h1, h4 ^= h1;
      return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
    }
    function sfc32(a, b, c, d) {
      a |= 0; b |= 0; c |= 0; d |= 0;
      let t = (a + b | 0) + d | 0;
      d = d + 1 | 0;
      a = b ^ b >>> 9;
      b = c + (c << 3) | 0;
      c = (c << 21 | c >>> 11);
      c = c + t | 0;
      return (t >>> 0) / 4294967296;
    }    

    function seededRand(c, salt) {
      // Use seeded
      // const seedgen = () => ((c.randomSeed + salt)*2**32)>>>0;
      const hashseed = cyrb128(c.randomSeed + salt)
      return sfc32(hashseed[0], hashseed[1], hashseed[2], hashseed[3]);
    }

    const OperatorTypes = {
      GT: '>',
      LT: '<'
    }

    class PipelineStep {
      id;
      constructor() {
        this.id = getGid();
      }
      getInputs() {
        console.log('Superclass getting inputs for ' + this.id)
      }
      renderInputs() {
        throw new Error('Undefined PipelineStep renderInputs called')
      }
      setValues(v) {
      }
      getInput(id) {
        let inputType = document.getElementById(this.elementId + id).type;
        if (inputType == "number") return +document.getElementById(this.elementId + id).value;
        if (inputType == "checkbox") return document.getElementById(this.elementId + id).checked;
      }

    }

    // A Generator has a generatePoints anda generateGeometry function
    // gP creates a list of shapes populated with a centre, angle and scale
    // gG calls for each shape a function which takes a centre, angle and radius
    //   and adds to that shape an array of points which it

    const SHAPES = {
      'hexagon': function(p) {
        for (let i = 0; i < 6; i++) {
          let a = (60 * i - 30) * Math.PI / 180;
          let rr = p.radius;
          p.points.push({
            x: p.centre.x + rr * Math.cos(a), y: p.centre.y + rr * Math.sin(a)
          })
          p.close = true;
        }
      },
      'square': function(p) {
        let rr = p.radius;
        for (let corner = 0; corner < 4; corner++) {
          p.points.push({
            x: p.centre.x + rr * (corner == 0 || corner == 3 ? 1 : -1), y: p.centre.y + rr * (corner < 2 ? 1 : -1)
          }) 
          p.close = true;
        }
      },
      'arrow': function(p) {
        p.points = [{x: p.centre.x, y: p.centre.y + p.radius}, 
                    {x: p.centre.x, y: p.centre.y - p.radius}, 
                    {x: p.centre.x + p.radius/2, y: p.centre.y - p.radius / 2}, 
                    {x: p.centre.x - p.radius/2, y: p.centre.y - p.radius / 2},
                    {x: p.centre.x, y: p.centre.y - p.radius}];
        p.close = false;
      }
    }

    // GENERATORS
    class Generator extends PipelineStep {
      shape;
      constructor(shape) {
        super()
        this.shape = shape;
      }

      // Every generator has two functions:
      // generatePoints defined by the specific generator type,
      // generateGeometry which always* works the same

      generatePoints(c) {
        throw new Error('Undefined Generator generatePoints called')
      }

      generateGeometry(c) {
        let g = this.generatePoints(c)
        for (const p of g) {
          // for each shape in the geometry,
          // populate a list of points
          p.points = [];
          this.shape(p)
        }
        return g
      }      
    }

    const Generators = {

    }
    class TransformModifyFunction {
      static scale(c, shape, scalar) {
        // scale shape's points based on scalar
        for (let p of shape.points) {
          let dx = shape.centre.x - p.x
          dx = dx * scalar
          p.x = shape.centre.x - dx

          let dy = shape.centre.y - p.y
          dy = dy * scalar
          p.y = shape.centre.y - dy
        }
      }

      // TODO: turn this into rotateAboutPoint and reuse for rotateInplace and rotateGlobal
      static rotateInplace(c, shape, angleRadians) {
        const centre = shape.centre;

        for (let point of shape.points) {  
          const dx = point.x - centre.x;
          const dy = point.y - centre.y;

          const cos = Math.cos(angleRadians);
          const sin = Math.sin(angleRadians);
          
          point.x = centre.x + dx * cos - dy * sin;
          point.y = centre.y + dx * sin + dy * cos
        }
      }

      static translateX(c, shape, d) {
        // Move centre so subsequent rotates do rotate in place
        shape.centre.x = shape.centre.x + d
        for (let point of shape.points) {  
          point.x = point.x + d
        }        
      }

      static translateY(c, shape, d) {
        shape.centre.y = shape.centre.y + d
        for (let point of shape.points) {
          point.y = point.y + d
        }        
      }      
    }

    const TransformModifiers = {
      Scale: class {
        humanName = "Scale"
        modify = TransformModifyFunction.scale
        // TODO: remember my frickin this binding rules for lambdas

    class TransformField extends PipelineStep {
      min;
      max;
      baseValue;
      random;
      steps;

      constructor(min = 0, max = 1, bv = 0, random = false, randomSign = false, steps = 0) {
        super()
        this.min = min;
        this.max = max;
        this.baseValue = bv; // 1 for multiplicative transforms, 0 for additive
        this.random = random;
        this.randomSign = randomSign;
        this.steps = steps; 
      }

      randomise(c, value, point) {
        if (this.random == false) return value;

        // Seed the PRNG with the config random seed and the point's position
        let p = seededRand(c, point.x + ", " + point.y)

        if (this.randomSign) {
          if (seededRand(c, point.x + " - " + point.y) < 0.5) {
            p = 0-p;
          }
        }

        // lerp between baseValue and value based on rnd[0,1)
        return ((value * p) + (this.baseValue * (1-p)))
      }

      // Put value into one of n equally likely buckets between min and max inclusive
      discretise(value) {
        if (this.steps == 0) return value;
        if (this.max == this.min) return this.min; // guard against /0
        // Lets pretend min = 5, max = 10 and steps = 3, p = 7
        let p = (value - this.min) / (this.max - this.min) // Normalise to 0 to 1 - gives us 0.4
        p = p * this.steps                                 // Normalise to 0 to steps - gives us 1.2
        p = Math.floor(p)                                  // Round down 0, 1, ... (steps - 1) - gives us 1
        p = p / (this.steps - 1)                           // Normalise back to [0,1) - gives us 0.5 as we're on middle step
        p = p * (this.max - this.min)                      // Normalise back to range extent - gives us 2.5
        p = p + this.min                                   // Move back up to actual range min-max - gives us 7.5

        return p;
      }
      value(c, point) {
        throw new Error('Uninitialised TransformField value called')
      }
      getValue(c, point) {
        return this.discretise(this.randomise(c, this.value(c, point), point))
      }
      renderInputs() {
        throw new Error('Uninitialised TransformField renderInputs called')
      }
    }

    const TransformFields = {
      YLinear: class YLinearTransformField extends TransformField {
        constructor() {
          super()
          this.elementId = this.id + '-ylinear'
        }
        value(c, point) {
          return this.min + ((this.max - this.min) * point.y / c.doc.h)
        }
        renderInputs() {
          return `<label>by Y from <input id='${this.elementId}-min' type=number value=${this.min}> to <input id='${this.elementId}-max' type=number value=${this.max}></label>
                  <label>🎲 <input id='${this.elementId}-rnd' type='checkbox' value='splooge'/> 📊 <input id='${this.elementId}-steps' type=number value=${this.steps}>`
        }
        getInputs(){
          this.min = this.getInput('-min');
          this.max = this.getInput('-max');
          this.random = this.getInput('-rnd');
          this.steps = this.getInput('-steps');
        }
      }

      , XLinear: class XLinearTransformField extends TransformField {
        constructor() {
          super()
          this.elementId = this.id + '-xlinear'
        }
        value(c, point) {
          return this.min + ((this.max - this.min) * point.x / c.doc.w)
        }
        renderInputs() {
          return `<label>by X from <input id='${this.elementId}-min' type=number value=${this.min}> to <input id='${this.elementId}-max' type=number value=${this.max}></label>
                  <label>🎲 <input id='${this.elementId}-rnd' type='checkbox' value='splooge'/> 📊 <input id='${this.elementId}-steps' type=number value=${this.steps}>`
        }
        getInputs(){
          this.min = this.getInput('-min');
          this.max = this.getInput('-max');
        }
      }
    }
    // TRANSFORMS
    class Transform extends PipelineStep {
      // A Transform has a transform function taking a shape
      // it applies some modify function based on a scalar amount
      // the Transform gets that scalar amount from a field which determines
      // an amount based on a coordinate
      //
      // The job of the Transform is:
      // for each shape in geometry:
      //   call transformModify(shape, transformField(shape.centre))
      constructor() {
        super()
      }

      apply(c, g) {
        for (let p of g) {
          this.transformModify.modify(c, p, this.transformField.getValue(c, p.centre))
        }
      }

      renderInputs() {
        return this.transformModify.renderInputs() + this.transformField.renderInputs()
      }

      getInputs() {
        // this.transformModify.getInputs(); // enable this if modifys ever get inputs
        this.transformField.getInputs();
      }
    }

    // COLOUR RULES
    const Rules = {
      Radius: class RadiusRule extends PipelineStep {
        humanName = "Radius"
        elementId = this.id + '-radius';
        operator;
        centre;
        radius;
        constructor(operator, centre, radius) {
          super()
          this.operator = operator;
          this.centre = centre;
          this.radius = radius;
        }
        classify(p) {
          let r = Math.hypot(p.centre.x - this.centre.x, p.centre.y - this.centre.y);
          if (this.operator == OperatorTypes.GT) {
            return r > this.radius;
          } else {
            return r < this.radius;
          }
        }
        renderInputs() {
          return `<label>Radius ${this.operator} <input id='${this.elementId}' type=number value=${this.radius}></label>`
        }
        getInputs() {
          const radius = document.getElementById(this.elementId).value
          if (!isNaN(radius)) {
            this.radius = radius
          }

          // TODO: centre
        }
      }

      , XRule: class XRule extends PipelineStep {
        humanName = "X coord"
        operator;
        limit;
        constructor(operator, limit, radius) {
          super()
          this.operator = operator;
          this.limit = limit;
        }
        classify(p) {
          if (this.operator == OperatorTypes.GT) {
            return p.centre.x > this.limit;
          } else {
            return p.centre.x < this.limit;
          }
        }
        renderInputs() {
          return `<label>X ${this.operator} <input id='${this.id}-limit' type=number value=${this.limit}></label>`
        }
        getInputs() {

        }
      }
    }
    const RuleGroup = class {
      rules = []

      constructor() { this.id = getGid(); }

      addRule(rule) {
        this.rules.push(rule)
      }

      // return true if p satisfies ALL rules
      classify(p) {
        for (const rule of this.rules) {
          if (!rule.classify(p)) {
            return false;
          }
        }
        return true;
      }
    }

    const RuleSet = class {
      id;
      colour;
      ruleGroups = [];
      constructor() { this.id = getGid(); }
      
      addGroup(g) {
        this.ruleGroups.push(g);
      }

      // return true if p satisfies ANY rule group
      classify(p) {
        // return true if there are no rules (default set)
        if (this.ruleGroups.length == 0) {
          return true;
        }
        for (const ruleGroup of this.ruleGroups) {
          if (ruleGroup.classify(p)) {
            return true;
          }
        }
        return false;
      }

      allRules() {
        let op = []
        for (let s of this.ruleGroups) {
          for (let r of s.rules) {
            op.push(r);
          }
        }
        return op
      }
    }

    function generateGeometry(c) {
      // TODO: The proper version
      let geometry = [] 
      for (gen of c.generators) {
        geometry = [...geometry, ...gen.generateGeometry(c)]
      }

      return geometry;
    }

    function applyTransforms(g,c) {
      for (const transform of c.transforms) {
        transform.apply(c, g)
      }
      return g;
    }

    function assignLayers(g, c) {
      let L = {
      }; 

      // There can be multiple rule sets assigning to one colour
      // We treated them separately for calculating path colour, 
      // but now combine to one layer per colour for SVG output
      for (const ruleSet of c.ruleSets) {
        if (!(ruleSet.colour in L)) {
          L[ruleSet.colour] = []
        }
      }
      
      for (const p of g) {
        for (const ruleSet of c.ruleSets) {
          if (ruleSet.classify(p)) {
            L[ruleSet.colour].push(p);
            break;
          }
        }
      }
      return L
    }

    function pathD(o) {
      return o.points.map((pt, i) => (i ? "L" : "M") + pt.x.toFixed(2) + " " + pt.y.toFixed(2)).join("") + (o.close ? "Z" : "")
    }

    function svgText(layers, one) {
      // TODO: de-Schlemiel this function
      let s = `<svg xmlns="${NS}" viewBox="0 0 200 200" width="200mm" height="200mm"><rect width="200" height="200" fill="white"/>`; 
      for (const n of (one == "all" ? Object.keys(layers) : [one])) {
        s += `<g stroke="${n}" fill="none" stroke-width="0.4">`; 
        for (const p of layers[n]) {
          s += `<path d="${pathD(p)}"/>`;
        }
        s += "</g>"
      } return s + "</svg>"
    }
    let current;

    function render(l) {
      view.innerHTML = ""; current = l; view.innerHTML = svgText(l, "all")
    }

    function recalculate() {
      let c = config;
      updateRules(c);
      render(assignLayers(applyTransforms(generateGeometry(c), c), c));
    }

    function buildUI(c) {
      ui = ""
      ui = ui + "<div id='generators-ui' class='step-group'>"
      for (gen of c.generators) {
        ui = ui + gen.renderInputs()
      }

      ui = ui + "<button onclick='newGen(\"Grid\")'>New generator</button></div>"

      ui = ui + "<div id='transforms-ui' class='step-group'>"
      for (xform of c.transforms) {
        ui = ui + xform.renderInputs()
      }
      ui = ui + "</div>"

      ui = ui + "<div id='rules-ui' class='step-group'>"
      for (rs of c.ruleSets) {
        ui = ui + "<div class='rule-set'>"
        for (rg of rs.ruleGroups) {
          ui = ui + "<div class='rule-group'>"
          for (r of rg.rules) {
            // TODO: generic X remove button here
            ui = ui + "<div class='rule-element'>" + r.renderInputs() + "</div>"
          }
          ui = ui + "</div>"
        }
        ui = ui + rs.colour + "</div>"
      }
      ui = ui + "</div>"

      return ui;
    }

    function updateRules(c) {
      // gens, xforms, colour rules are PipelineSteps
      // they must implement:
      //   a function to find form inputs
      //   a function to set values from an object
      // for each geometry generator, transform, rule:
      //   find inputs from its id
      //   (get the rule/gen/xform id, ask it what fields it wants, get those elements, get input values, setValues on rule)
      //   change the config accordingly
      pipelineSteps = c.generators.concat(c.transforms)
      // populate with gens and xforms
      for (let r of c.ruleSets) {
        pipelineSteps = pipelineSteps.concat(r.allRules())
      }

      for (let s of pipelineSteps) {
        s.getInputs();
      }
    }

    function download(which) {
      let a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([svgText(current, which)], {
        type: "image/svg+xml"
      })); a.download = which + ".svg"; a.click()
    }
    
    // Set up initial UI
    document.getElementById('whole-ui').innerHTML = buildUI(config);
    recalculate();
  </script>
</body>

</html>
