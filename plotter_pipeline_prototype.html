<!doctype html>
<html>

<head>
  <meta charset='utf-8'>
  <title>Plotter</title>
  <style>
    body {
      margin: 0;
      display: flex;
      font-family: Arial
    }

    #side {
      width: 260px;
      padding: 12px;
      background: #eee
    }

    #main {
      flex: 1;
      padding: 12px
    }

    label {
      display: block;
      margin: 6px 0
    }

    svg {
      border: 1px solid #888;
      width: 700px;
      height: 700px
    }

    .rule-set, .rule-group, .step-group {
      border: 1px solid black;
      margin-bottom: 1em;
    }
    
  </style>
</head>

<body>
  <div id=side>
    <h3>Parameters</h3>
    <div id="whole-ui">
      <label>Generators</label>
      <div id="generators-ui" class="step-group"></div>
      <label>Transforms</label>
      <div id="transforms-ui" class="step-group"></div>
      <label>Rules</label>
      <div id="rules-ui" class="step-group"></div>
    </div>
    <button onclick='recalculate()'>Recalculate</button>
    <button onclick='download("all")'>Preview SVG</button>
    <button onclick='download("red")'>Red SVG</button>
    <button onclick='download("black")'>Black SVG</button>
  </div>
  <div id=main>
    <div id=view></div>
  </div>
  <script>
    const NS = "http://www.w3.org/2000/svg";
    // shape types? Too much?
    const GenTypes = {
      STAGGEREDGRID: 'staggeredgrid',
      GRID: 'grid',
      CIRCLE: 'circle'
    }
    const TransformTypes = {
      SCALE: 'scale',
      ROTATE: 'rotate'
    }
    const RuleTypes = {
      RADIUS: 'radius',
      XCOORD: 'xcoord',
      YCOORD: 'ycoord'
    }

    let gid = 1;
    function getGid() {
      return gid++;
    }

    const OperatorTypes = {
      GT: '>',
      LT: '<'
    }

    class PipelineStep {
      id;
      constructor() {
        this.id = getGid();
      }
      getInputs() {
        console.log('Superclass getting inputs for ' + this.id)
      }
      renderInputs() {
        throw new Error('Undefined PipelineStep renderInputs called')
      }
      setValues(v) {
      }
    }

    // A Generator has a generatePoints anda generateGeometry function
    // gP creates a list of shapes populated with a centre, angle and scale
    // gG calls for each shape a function which takes a centre, angle and radius
    //   and adds to that shape an array of points which it

    const SHAPES = {
      'hexagon': function(p) {
        for (let i = 0; i < 6; i++) {
          let a = (60 * i - 30) * Math.PI / 180;
          let rr = p.radius;
          p.points.push({
            x: p.centre.x + rr * Math.cos(a), y: p.centre.y + rr * Math.sin(a)
          })
        }
      },
      'square': function(p) {
        let rr = p.radius;
        for (let corner = 0; corner < 4; corner++) {
          p.points.push({
            x: p.centre.x + rr * (corner == 0 || corner == 3 ? 1 : -1), y: p.centre.y + rr * (corner < 2 ? 1 : -1)
          }) 
        }
      }
    }

    // GENERATORS
    class Generator extends PipelineStep {
      shape;
      constructor(shape) {
        super()
        this.shape = shape;
      }

      // Every generator has two functions:
      // generatePoints defined by the specific generator type,
      // generateGeometry which always* works the same

      generatePoints(c) {
        throw new Error('Undefined Generator generatePoints called')
      }

      generateGeometry(c) {
        let g = this.generatePoints(c)
        for (const p of g) {
          // for each shape in the geometry,
          // populate a list of points
          p.points = [];
          this.shape(p)
        }
        return g
      }      
    }
    class StaggeredGridGen extends Generator {
      rows;
      cols;
      x_spacing;
      y_spacing;
      elementId;

      constructor(rows, cols, sx, sy, shape, radius) {
        super(shape)
        this.rows = rows;
        this.cols = cols;
        this.x_spacing = sx;
        this.y_spacing = sy;
        this.shape = shape;
        this.radius = radius

        this.elementId = this.id + '-staggeredgrid'
      }

      generatePoints(c) {
        let g = [];
        for (let r = 0; r < this.rows; r++){ 
          for (let col = 0; col < this.cols; col++) {
            let x = (col + 1) * this.x_spacing + (r % 2 ? this.x_spacing / 2 : 0), y = (r + 1) * this.y_spacing;
            // push a shape with a centre and radius to g
            g.push({
              centre: {
                x, y
              }, radius: this.radius, angle: 0, points: []
            })
          }
        }
        return g
      }

      renderInputs() {
        return `<label>Hex grid</label>
                <label>Rows <input id='${this.elementId}-rows' type=number value=${this.rows}></label>
                <label>Cols <input id='${this.elementId}-cols' type=number value=${this.cols}></label>
                <label>Base radius <input id='${this.elementId}-radius' type=number step=0.1 value=${this.radius}></label>`
      }
    }

    class GridGen extends Generator {
      rows;
      cols;
      x_spacing;
      y_spacing;
      elementId;

      constructor(rows, cols, sx, sy, shape, radius) {
        super(shape)
        this.rows = rows;
        this.cols = cols;
        this.x_spacing = sx;
        this.y_spacing = sy;
        this.shape = shape;
        this.radius = radius

        this.elementId = this.id + '-grid'
      }

      generatePoints(c) {
        let g = [];
        for (let r = 0; r < this.rows; r++){ 
          for (let col = 0; col < this.cols; col++) {
            let x = (col + 1) * this.x_spacing, y = (r + 1) * this.y_spacing;
            // push a shape with a centre and radius to g
            g.push({
              centre: {
                x, y
              }, radius: this.radius, angle: 0, points: []
            })
          }
        }
        return g
      }

      renderInputs() {
        return `<label>Square grid</label>
                <label>Rows <input id='${this.elementId}-rows' type=number value=${this.rows}></label>
                <label>Cols <input id='${this.elementId}-cols' type=number value=${this.cols}></label>
                <label>Base radius <input id='${this.elementId}-radius' type=number step=0.1 value=${this.radius}></label>`
      }
    }    

    class TransformModifyFunction {
      static scale(c, shape, scalar) {
        // scale shape's points based on scalar
        for (let p of shape.points) {
          let dx = shape.centre.x - p.x
          dx = dx * scalar
          p.x = shape.centre.x - dx

          let dy = shape.centre.y - p.y
          dy = dy * scalar
          p.y = shape.centre.y - dy
        }
      }

      // TODO: turn this into rotateAboutPoint and reuse for rotateInplace and rotateGlobal
      static rotateInplace(c, shape, angleRadians) {
        const centre = shape.centre;

        for (let point of shape.points) {  
          const dx = point.x - centre.x;
          const dy = point.y - centre.y;

          const cos = Math.cos(angleRadians);
          const sin = Math.sin(angleRadians);
          
          point.x = centre.x + dx * cos - dy * sin;
          point.y = centre.y + dx * sin + dy * cos
        }
      }
    }

    const TransformModifiers = {
      Scale: class {
        humanName = "Scale"
        modify = TransformModifyFunction.scale
        // TODO: remember my frickin this binding rules for lambdas
        renderInputs = function() {return `<label>${this.humanName}</label>`}        
        constructor() {
        }
        
      },
      RotateInPlace: class {
        humanName = "Rotate in place"
        modify = TransformModifyFunction.rotateInplace      
        renderInputs = function() {return `<label>${this.humanName}</label>`}
        constructor(){}
      }
    }

    class TransformField {
      value(c, point) {
        throw new Error('Uninitialised TransformField value called')
      }
      renderInputs() {
        throw new Error('Uninitialised TransformField renderInputs called')
      }
    }

    class YLinearTransformField extends TransformField {
      min;
      max;

      value(c, point) {
        return this.min + (this.max * point.y / c.doc.h)
      }
      renderInputs() {
        return `<label>by Y coordinate from <input id='${this.elementId}-min' type=number value=${this.min}>x to <input id='${this.elementId}-min' type=number value=${this.max}>x</label>`
      }      
    }

    class XLinearTransformField extends TransformField {
      min;
      max;

      value(c, point) {
        return this.min + (this.max * point.x / c.doc.w)
      }

      renderInputs() {
        return `<label>by X coordinate from <input id='${this.elementId}-min' type=number value=${this.min}>x to <input id='${this.elementId}-min' type=number value=${this.max}>x</label>`
      }       
    }

    // TRANSFORMS
    class Transform extends PipelineStep {
      // A Transform has a transform function taking a shape
      // it applies some modify function based on a scalar amount
      // the Transform gets that scalar amount from a field which determines
      // an amount based on a coordinate
      //
      // The job of the Transform is:
      // for each shape in geometry:
      //   call transformModify(shape, transformField(shape.centre))
      constructor() {
        super()
      }

      apply(c, g) {
        for (let p of g) {
          this.transformModify.modify(c, p, this.transformField.value(c, p.centre))
        }
      }

      renderInputs() {
        return this.transformModify.renderInputs() + this.transformField.renderInputs()
      }
    }

    // COLOUR RULES
    class RadiusRule extends PipelineStep {
      type = RuleTypes.RADIUS;
      elementId = this.id + '-radius';
      operator;
      centre;
      radius;
      constructor(operator, centre, radius) {
        super()
        this.operator = operator;
        this.centre = centre;
        this.radius = radius;
      }
      classify(p) {
        let r = Math.hypot(p.centre.x - this.centre.x, p.centre.y - this.centre.y);
        if (this.operator == OperatorTypes.GT) {
          return r > this.radius;
        } else {
          return r < this.radius;
        }
      }
      renderInputs() {
        return `<label>Radius ${this.operator} <input id='${this.elementId}' type=number value=${this.radius}></label>`
      }
      getInputs() {
        const radius = document.getElementById(this.elementId).value
        if (!isNaN(radius)) {
          this.radius = radius
        }

        // TODO: centre
      }
    }

    class XRule extends PipelineStep {
      type = RuleTypes.XCOORD;
      operator;
      limit;
      constructor(operator, limit, radius) {
        super()
        this.operator = operator;
        this.limit = limit;
      }
      classify(p) {
        if (this.operator == OperatorTypes.GT) {
          return p.centre.x > this.limit;
        } else {
          return p.centre.x < this.limit;
        }
      }
      renderInputs() {
        return `<label>X ${this.operator} <input id='${this.id}-limit' type=number value=${this.limit}></label>`
      }      
    }

    const RuleGroup = class {
      rules = []

      constructor() { this.id = getGid(); }

      addRule(rule) {
        this.rules.push(rule)
      }

      // return true if p satisfies ALL rules
      classify(p) {
        for (const rule of this.rules) {
          if (!rule.classify(p)) {
            return false;
          }
        }
        return true;
      }
    }

    const RuleSet = class {
      id;
      colour;
      ruleGroups = [];
      constructor() { this.id = getGid(); }
      
      addGroup(g) {
        this.ruleGroups.push(g);
      }

      // return true if p satisfies ANY rule group
      classify(p) {
        // return true if there are no rules (default set)
        if (this.ruleGroups.length == 0) {
          return true;
        }
        for (const ruleGroup of this.ruleGroups) {
          if (ruleGroup.classify(p)) {
            return true;
          }
        }
        return false;
      }

      allRules() {
        let op = []
        for (let s of this.ruleGroups) {
          for (let r of s.rules) {
            op.push(r);
          }
        }
        return op
      }
    }

    let staggeredHexGen = new StaggeredGridGen(15, 10, 15, 15, SHAPES.hexagon, 6)
    let squareGen = new GridGen(10, 15, 20, 20, SHAPES.square, 8)

    let yScaleXform = new Transform()
    yScaleXform.transformModify = new TransformModifiers.Scale
    yScaleXform.transformField = new YLinearTransformField()
    yScaleXform.transformField.min = 0.3
    yScaleXform.transformField.max = 1.0

    let xRotateXform = new Transform()
    xRotateXform.transformModify = new TransformModifiers.RotateInPlace
    xRotateXform.transformField = new XLinearTransformField()
    xRotateXform.transformField.min = -0.1
    xRotateXform.transformField.max = 0.5; // Math.PI/6

    let initRule = new RadiusRule(OperatorTypes.LT, {x: 100, y: 100}, 30) 
    let xRule = new XRule(OperatorTypes.GT, 100);
    let initGroup = new RuleGroup();
    initGroup.addRule(initRule)
    initGroup.addRule(xRule)

    let secondRule = new RadiusRule(OperatorTypes.LT, {x: 100, y: 100}, 45) 
    let secondGroup = new RuleGroup();
    secondGroup.addRule(secondRule)

    let tRule = new RadiusRule(OperatorTypes.LT, {x: 100, y: 100}, 65) 
    let tGroup = new RuleGroup();
    tGroup.addRule(tRule)

    let initSet = new RuleSet();
    initSet.colour = 'yellow'
    initSet.addGroup(initGroup)

    let secondSet = new RuleSet();
    secondSet.colour = 'red'
    secondSet.addGroup(secondGroup)

    let tSet = new RuleSet();
    tSet.colour = 'yellow'
    tSet.addGroup(tGroup)

    let defaultSet = new RuleSet();
    defaultSet.colour = 'black'

    let config = {
      doc: {
        w: 200, h: 200
      },
      generators: [staggeredHexGen, squareGen],
      transforms: [yScaleXform, xRotateXform],
      ruleSets: [initSet, secondSet, tSet, defaultSet]
    }

    function generateGeometry(c) {
      // TODO: The proper version
      let geometry = [] 
      for (gen of c.generators) {
        geometry = [...geometry, ...gen.generateGeometry(c)]
      }

      return geometry;
    }

    function applyTransforms(g,c) {
      for (const transform of c.transforms) {
        transform.apply(c, g)
      }
      return g;
    }

    function assignLayers(g, c) {
      let L = {
      }; 

      // There can be multiple rule sets assigning to one colour
      // We treated them separately for calculating path colour, 
      // but now combine to one layer per colour for SVG output
      for (const ruleSet of c.ruleSets) {
        if (!(ruleSet.colour in L)) {
          L[ruleSet.colour] = []
        }
      }
      
      for (const p of g) {
        for (const ruleSet of c.ruleSets) {
          if (ruleSet.classify(p)) {
            L[ruleSet.colour].push(p);
            break;
          }
        }
      }
      return L
    }

    function pathD(o) {
      return o.points.map((pt, i) => (i ? "L" : "M") + pt.x.toFixed(2) + " " + pt.y.toFixed(2)).join("") + "Z"
    }

    function svgText(layers, one) {
      // TODO: de-Schlemiel this function
      let s = `<svg xmlns="${NS}" viewBox="0 0 200 200" width="200mm" height="200mm"><rect width="200" height="200" fill="white"/>`; 
      for (const n of (one == "all" ? Object.keys(layers) : [one])) {
        s += `<g stroke="${n}" fill="none" stroke-width="0.4">`; 
        for (const p of layers[n]) {
          s += `<path d="${pathD(p)}"/>`;
        }
        s += "</g>"
      } return s + "</svg>"
    }
    let current;

    function render(l) {
      view.innerHTML = ""; current = l; view.innerHTML = svgText(l, "all")
    }

    function recalculate() {
      let c = config;
      updateRules(c);
      render(assignLayers(applyTransforms(generateGeometry(c), c), c));
    }

    function buildUI(c) {
      ui = ''
      // TODO: gens and xforms here
      ui = ui + "<div class='generator-set'>"
      for (gen of c.generators) {
        ui = ui + gen.renderInputs()
      }
      ui = ui + "</div>"

      ui = ui + "<div class='generator-set'>"
      for (xform of c.transforms) {
        ui = ui + xform.renderInputs()
      }
      ui = ui + "</div>"

      for (rs of c.ruleSets) {
        ui = ui + "<div class='rule-set'>"
        for (rg of rs.ruleGroups) {
          ui = ui + "<div class='rule-group'>"
          for (r of rg.rules) {
            // TODO: generic X remove button here
            ui = ui + "<div class='rule-element'>" + r.renderInputs() + "</div>"
          }
          ui = ui + "</div>"
        }
        ui = ui + rs.colour + "</div>"
      }

      return ui;
    }

    function updateRules(c) {
      // gens, xforms, colour rules are PipelineSteps
      // they must implement:
      //   a function to find form inputs
      //   a function to set values from an object
      // for each geometry generator, transform, rule:
      //   find inputs from its id
      //   (get the rule/gen/xform id, ask it what fields it wants, get those elements, get input values, setValues on rule)
      //   change the config accordingly
      pipelineSteps = []
      // populate with gens and xforms
      for (let r of c.ruleSets) {
        pipelineSteps = [...pipelineSteps, ...r.allRules()]
      }

      for (let s of pipelineSteps) {
        s.getInputs();
      }
    }

    function download(which) {
      let a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([svgText(current, which)], {
        type: "image/svg+xml"
      })); a.download = which + ".svg"; a.click()
    }
    
    // Set up initial UI
    document.getElementById('rules-ui').innerHTML = buildUI(config);
    recalculate();
  </script>
</body>

</html>
