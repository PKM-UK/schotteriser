basic <HTML></HTML>
constants
utility stuff (getGid, PRNG)
svg making stuff
entire document machinery (UI handling etc)
Pipeline step generic bits (ctor)

<HTML>

  <meta charset='utf-8'>
  <title>Plotter</title>
  <style>
body {
  margin: 0;
  display: flex;
  font-family: Arial;
  overflow: hidden;
}

#side {
  width: 300px;
  padding: 12px;
  background: #eee
}

#main {
  flex: 1;
  padding: 12px;
  overflow-x: scroll;
}

#side {

}

svg {
  border: 1px solid #888;
  /* SVG mm dimensions * 3.5? TODO: do this at runtime if we want to be able to resize */
  width: 875px;
  height: 700px;
}

/* Top UI */
#pipeline-picker, #buttons-ui {
  padding: 3px;
}

.pipeline-button, .action-button {
  margin: 2px;
  font-size: 14px;
}

.pipeline-button.current {
  outline: 2px solid #333;
  /* outline-offset: 2px; */
}

/* Generic step stuff */

.rule-set, .rule-group, .step-group {
  position: relative;
  border: 1px solid black;
  margin-bottom: 1em;
  margin-left: 2px;
  margin-right: 2px;
}

.rule-set {
  padding-top: 32px; /* space for buttons */
}

.rule-element {
  padding: 2px 0px;
}

.colour-block {
  width: 2em;
  height: 2em;
}

.step-group input {
  width: 3em;
}

.step-group p {
  margin-top: 3px;
  margin-bottom: 3px;
}

.step-container {
    position: relative;
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    gap: 6px 12px;

    padding: 32px 12px 12px 14px;
    box-sizing: border-box;

    background: #f7f7f5;
    border: 1px solid #d4d4cf;
    border-radius: 5px;

    align-items: center;
}

.step-container > label:first-of-type {
    font-weight: 600;
    color: #333;
}

.step-title {
    font-weight: 600;
    color: #333;
    margin-bottom: 2px;
}

.step-container > .step-buttons, .rule-set > .step-buttons {
    position: absolute;
    top: 4px;
    right: 4px;

    border: 0;
    background: transparent;
    color: #777;
    cursor: pointer;
}

.step-buttons button, .step-button {
    padding: 1px;
    margin: 1px;
}

.step-container > button:hover {
    color: #b33;
}

.parameter {
    display: contents;
}

.parameter.checkbox-row {
    display: flex;
    grid-column: 1 / -1;
    gap: 10px;
    align-items: center;
}

.parameter-values {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
}

.parameter input,
.parameter select,
.step-container > select {
    padding: 3px 5px;

    border: 1px solid #bdbdb8;
    border-radius: 3px;
    background: white;

    font: inherit;

    min-width: 0;
    box-sizing: border-box;
}

.parameter input {
    width: 60px;
    box-sizing: border-box;
}

.parameter input.attrib-check {
  width: 20px;
}

.parameter input:focus,
.parameter select:focus,
.step-container > select:focus {
    outline: 2px solid #8aa6a3;
    outline-offset: 1px;
    border-color: #718f8c;
}

.add-step {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    align-items: center;
    padding: 12px 32px 12px 14px;

}

/* Should this just be a class called "action-button" or something? Neater CSS, messier HTML */
.add-step button, .add-step select, #buttons-ui button, #pipeline-picker button {
    padding: 5px 10px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: #e8e8e4;
    color: #333;

    cursor: pointer;
}

.add-step select {
  padding: 5px;
}

.add-step button:hover {
    background: #deded9;
}

input {
  -moz-appearance: textfield;
  appearance: textfield;
}

input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
    }

.colour-picker {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 5px;
}

.colour-picker input[type="radio"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.colour-picker label {
    width: 22px;
    height: 22px;
    display: block;

    background: var(--colour);
    border: 2px solid #aaa;

.colour-picker input[type="radio"]:focus-visible + label {

}

  <div id="side">

        <button class="pipeline-button current" onclick="setActivePipeline(0)">1</button>
        <button class="pipeline-button" onclick="setActivePipeline(1)">2</button>

        <button class="pipeline-button" onclick="setActivePipeline(3)">4</button>
    </div>

      <button onclick='recalculate()'>Recalculate</button>

    </div>

    </div>

<script type="text/javascript">
const util = {
  gid: 1,
  getGid: function() {
    return this.gid++;
  },

  // Seeded PRNG stuff
  cyrb128: function(str) {
    let h1 = 1779033703, h2 = 3144134277,
        h3 = 1013904242, h4 = 2773480762;
    for (let i = 0, k; i < str.length; i++) {
        k = str.charCodeAt(i);
        h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
        h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
        h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
        h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    h1 ^= (h2 ^ h3 ^ h4), h2 ^= h1, h3 ^= h1, h4 ^= h1;
    return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
  },
  sfc32: function(a, b, c, d) {
    a |= 0; b |= 0; c |= 0; d |= 0;
    let t = (a + b | 0) + d | 0;
    d = d + 1 | 0;
    a = b ^ b >>> 9;
    b = c + (c << 3) | 0;
    c = (c << 21 | c >>> 11);
    c = c + t | 0;
    return (t >>> 0) / 4294967296;
  },

  seededRand: function (salt) {
    const hashseed = this.cyrb128(config.randomSeed + salt) //  should have one seed per pipeline
    return this.sfc32(hashseed[0], hashseed[1], hashseed[2], hashseed[3]);
  },
  clamp: function(a, b, x) {
    let min = Math.min(a, b)
    let max = Math.max(a, b)

    return Math.min(max, Math.max(min, x))
  },
  angleFromTop: function (x, y) {
    const angle = Math.atan2(x, -y) * 180 / Math.PI;
    return (angle + 360) % 360;
  },

  download: function (which) {
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([SVGbuilder.svgText(which)], {
      type: 'image/svg+xml'
    }));
    a.download = which + '.svg';
    a.click();
  },

  downloadSelected: function() {
    let which = document.getElementById('colour-select').value;
    util.download(which)
  }
}

let config = {
  randomSeed: 1,
  doc: {
    w: 250, h: 200
  },
  colours: ['black', 'red', 'green', 'blue', 'purple'],
  pipelines: [],
  activePipeline: null,
  changeTimer: 0,
}

// whole page stuff

// Refresh functions
function refresh() {
  // steps changed in backend: redraw UI and SVG
  redrawUI()
  redrawSVG()
}

function recalculate() {
  // rules changed on UI: update steps from UI and redraw SVG
  updateSteps()
  // redrawSVG()
  refresh()
}

function formChangeRecalculate() {
    const focusedId = document.activeElement?.id;

    recalculate();

    if (focusedId) {
        document.getElementById(focusedId)?.focus();
    }
}

function queueFormChangeRecalculate() {
  window.clearTimeout(config.changeTimer)
  config.changeTimer = window.setTimeout(formChangeRecalculate, 100);
}

function formInputChangeHandler() {
  queueFormChangeRecalculate();
}

function updateSteps() {
  config.activePipeline.updateSteps()
}

function redrawUI() {
  let ui = config.activePipeline.buildUI()
  document.getElementById('steps-ui').innerHTML = ui;
}

function redrawSVG() {
  let svgtag = SVGbuilder.svgText('all');
  document.getElementById('view').innerHTML = svgtag;
}

// Button handlers
function setActivePipeline(index) {
  config.activePipeline = config.pipelines[index];
  let butts = document.querySelectorAll('.pipeline-button');
  butts.forEach((el) => el.classList.remove('current'));
  butts[index].classList.add('current');
  refresh();
}
function removeStepGlobal(id) {
  for (let pipeline of config.pipelines) {
    if (pipeline.removeStep(id)) {
      refresh();
      break;
    }
  }
}

function newGenerator() {
  let newGen = new Generator(Generator.patterns[0])
  config.activePipeline.generators.push(newGen)
  refresh(); 
}

function newTransform() {
  let type = document.getElementById('new-xform-type').value;
  let newTrans = new Transform('X', type)
  config.activePipeline.transforms.push(newTrans)
  refresh(); 
}

function newRuleSet() {
  config.activePipeline.ruleSets.unshift(new RuleSet());
  refresh();
}

function newRuleGroup(id) {
  const activeSet = config.activePipeline.ruleSets.find((el) => el.id == id)
  if (activeSet != null) {
    activeSet.addGroup(new RuleGroup())
  }
  refresh();
}

function newRuleInGroup(sid) {
  // add a new group, add a rule to it
  const activeSet = config.activePipeline.ruleSets.find((el) => el.id == sid)
  if (activeSet != null) {
    let newGroup = new RuleGroup()
    activeSet.addGroup(newGroup)
  
    newRule(sid, newGroup.id)
  }
}

function stepUp(id) {
  let i = config.activePipeline.generators.findIndex((el) => el.id == id);
  if (i > 0) {
    let temp = config.activePipeline.generators[i]
    config.activePipeline.generators[i] = config.activePipeline.generators[i-1]
    config.activePipeline.generators[i-1] = temp
  } else {
    let i = config.activePipeline.transforms.findIndex((el) => el.id == id);
    if (i > 0) {
      let temp = config.activePipeline.transforms[i]
      config.activePipeline.transforms[i] = config.activePipeline.transforms[i-1]
      config.activePipeline.transforms[i-1] = temp
    } else {
      
      let i = config.activePipeline.ruleSets.findIndex((el) => el.id == id);
      if (i > 0) {
        let temp = config.activePipeline.ruleSets[i]
        config.activePipeline.ruleSets[i] = config.activePipeline.ruleSets[i-1]
        config.activePipeline.ruleSets[i-1] = temp
      }
    }
  }
  recalculate()
}

function stepDown(id) {
  let i = config.activePipeline.generators.findIndex((el) => el.id == id);
  if (i > -1 && i < config.activePipeline.generators.length) {
    let temp = config.activePipeline.generators[i]
    config.activePipeline.generators[i] = config.activePipeline.generators[i+1]
    config.activePipeline.generators[i+1] = temp
  } else {
    let i = config.activePipeline.transforms.findIndex((el) => el.id == id);
    if (i > -1 && i < config.activePipeline.transforms.length) {
      let temp = config.activePipeline.transforms[i]
      config.activePipeline.transforms[i] = config.activePipeline.transforms[i+1]
      config.activePipeline.transforms[i+1] = temp
    } else {
      
      let i = config.activePipeline.ruleSets.findIndex((el) => el.id == id);
      if (i > -1 && i < config.activePipeline.ruleSets.length) {
        let temp = config.activePipeline.ruleSets[i]
        config.activePipeline.ruleSets[i] = config.activePipeline.ruleSets[i+1]
        config.activePipeline.ruleSets[i+1] = temp
      }
    }
  }
  recalculate()
}

function newRule(sid, gid) {
  const activeSet = config.activePipeline.ruleSets.find((el) => el.id == sid)
  if (activeSet != null) {
    const activeGroup = activeSet.ruleGroups.find((el) => el.id == gid)
    if (activeGroup != null) {
      activeGroup.addRule(new Rule())
    }
  }
  refresh();
}

let SVGbuilder = {
  // Remit: ask pipelines for layers of geometry, consolidate the layers, make SVG text from that
  current: '',

  pathD: function (o) {
      return o.points.map((pt, i) => (i ? 'L' : 'M') + pt.x.toFixed(2) + ' ' + pt.y.toFixed(2)).join('') + (o.close ? 'Z' : '');
  },

  getLayers: function() {
    let outputLayers = {}
    for (pipeline of config.pipelines) {
      pipelineLayers = pipeline.getLayers()
      for (layer in pipelineLayers) {
        if (layer in outputLayers) {
          outputLayers[layer] = outputLayers[layer].concat(pipelineLayers[layer])
        } else {
          outputLayers[layer] = [].concat(pipelineLayers[layer])
        }
      }
    }

    return outputLayers;
  },

  svgText: function (one) {
    const NS = "http://www.w3.org/2000/svg";
    let layers = this.getLayers();
    let w = config.doc.w;
    let h = config.doc.h;
    // TODO: de-Schlemiel this function
    let s = `<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" width="${w}mm" height="${h}mm"><rect width="${w}" height="${h}" fill="white"/>`; 
    for (const n of (one == "all" ? Object.keys(layers) : [one])) {
      s += `<g stroke="${n}" fill="none" stroke-width="0.4">`; 
      for (const p of layers[n]) {
        if (!this.prune(p)) {
          s += `<path d="${this.pathD(p)}"/>`;
        }
      }
      s += '</g>';
    }
    return s + '</svg>';
  }, 

  prune: function(s) {
    // Return true if we don't want to draw the shape: if all its points are coincident, or it's outside the canvas boundary
    let firstpoint = s.points[0]
    let coincident = true;
    for (let p of s.points) {
      if (p.x > config.doc.w || p.x < 0 || p.y > config.doc.h || p.y < 0) return true;
      if (p.x != firstpoint.x || p.y != firstpoint.y) coincident = false;
    }
    return coincident;
  }
}

class Pipeline {
  // Remit: have Pipelinesteps, build and read from pipeline ui, return layers of transformed geometry
  generators = []
  transforms = []
  ruleSets = []

  #generateGeometry() {
    let geometry = [] 
    for (const gen of this.generators) {
      geometry = [...geometry, ...gen.generateGeometry()]
    }

    return geometry;
  }

  #applyTransforms(g) {
    for (const transform of this.transforms) {
      transform.apply(g)
    }
    return g;
  }

  #assignLayers(g) {
    // put geometry into layers
    let L = {
    }; 

    // There can be multiple rule sets assigning to one colour
    // We treated them separately for calculating path colour, 
    // but now combine to one layer per colour for SVG output
    for (const ruleSet of this.ruleSets) {
      if (!(ruleSet.colour in L)) {
        L[ruleSet.colour] = []
      }
    }
    
    for (const p of g) {
      for (const ruleSet of this.ruleSets) {
        if (ruleSet.classify(p)) {
          L[ruleSet.colour].push(p);
          break;
        }
      }
    }
    return L;
  }

  getLayers() {
    // build the geometry, apply transforms, assign to layers following rules
    return this.#assignLayers(this.#applyTransforms(this.#generateGeometry()))
  }

  removeStep(elementId) {
    let removed = false;

    // Remove from config
    for (let g in this.generators) {
      if (this.generators[g].id == elementId) {
        this.generators.splice(g, 1);
        removed = true;
        break;
      }
    }
    if (!removed) {
      for (let g in this.transforms) {
        if (this.transforms[g].id == elementId) {
          this.transforms.splice(g, 1);
          removed = true;
          break;
        }
      }
    }
    if (!removed) {
      for (let s in this.ruleSets) {
        if (this.ruleSets[s].id == elementId) {
          this.ruleSets.splice(s, 1)
          removed = true;
          break;
        }
      }
    }
    if (!removed) {
      for (let s in this.ruleSets) {
        for (let g in this.ruleSets[s].ruleGroups) {
          if (this.ruleSets[s].ruleGroups[g].id == elementId) {
            this.ruleSets[s].ruleGroups.splice(g, 1);
            removed = true;
            break;
          }
        }
      }
    }
    if (!removed) {
      for (let s in this.ruleSets) {
        for (let g in this.ruleSets[s].ruleGroups) {
          for (let r in this.ruleSets[s].ruleGroups[g].rules) {
            if (this.ruleSets[s].ruleGroups[g].rules[r].id == elementId) {
              this.ruleSets[s].ruleGroups[g].rules.splice(r, 1);
              removed = true;

              // Now tidy up empty groups
              if (this.ruleSets[s].ruleGroups[g].rules.length == 0) {
                this.ruleSets[s].ruleGroups.splice(g, 1);
              }
              break;
            }
          }
        }
      }
    }    

    return removed;
  }


  buildUI() {
    // TODO: suck less
    let ui = ''
    ui = ui + '<div id="generators-ui" class="step-group">'
    for (let gen of this.generators) {
      ui = ui + '<div class="step-container" id="' + gen.id + '-container">' + gen.renderInputs() + '</div>'
    }

    ui = ui + '<div class="add-step"><button onclick="newGenerator()">New generator</button></div></div>'

    
    ui = ui + '<div id="transforms-ui" class="step-group">'
    for (let xform of this.transforms) {
      ui = ui + '<div class="step-container" id="' + xform.id + '-container">' + xform.renderInputs() + '</div ending="step-container">'
    }
    
    ui = ui + '<div class="add-step"><button onclick="newTransform()">New </button><select id="new-xform-type">'
    for (let mt of Transform.getModifierTypes()) {
      ui = ui + `<option value=${mt}>${mt}</option>`
    }
    ui = ui + '</select></div></div>'
    

    ui = ui + '<div id="rules-ui" class="step-group">'
      
    
    for (let rs of this.ruleSets) {
      ui = ui + '<div class="rule-set">' + rs.renderGenericInputs() + `<div class="colour-picker" id="${rs.id}-colour">`

      // colour picker
      let cols = config.colours;
      for (let i in cols) {
        let col = cols[i];
        ui = ui + `
          <input type="radio" onchange="formInputChangeHandler()" name="${rs.id}-colour" id="${rs.id}-colour-${col}" value="${col}" ${rs.colour == col ? 'checked' : ''}>
          <label for="${rs.id}-colour-${col}" style="--colour: ${col}"></label>
        `
      }
      ui = ui + '</div>'

      if (rs.ruleGroups.length > 0) {
        for (let rg of rs.ruleGroups) {
          ui = ui + '<div class="rule-group">'
          if (rg.rules.length > 1) {
            ui = ui + `<p style="padding: 2px;">Group ${rg.id}<button class="step-button" style="float: right" onclick="removeStepGlobal(${rg.id})">❎</button></p>`
          }
          for (let r of rg.rules) {
            ui = ui + '<div class="rule-element">' + r.renderInputs() + '</div ending="rule">'
          }
          ui = ui + `<div class="add-step"><button onclick="newRule(${rs.id}, ${rg.id})">New rule</button></div>`;
          ui = ui + '</div ending="group">';
        }

        ui = ui + `<div class="add-step"><button onclick="newRuleGroup(${rs.id})">New group</button></div>`;
      } else {
        ui = ui + `<div class="add-step"><button onclick="newRuleInGroup(${rs.id})">New rule</button></div>`;
      }

      ui = ui + '</div ending="set">'
    }

    ui = ui + `<div class="add-step"><button onclick="newRuleSet()">New set</button></div>`;
      
    ui = ui + '</div>'

    return ui;
  }

  

  updateSteps() {
    // Update all the setup of the pipeline from the active UI
    let pipelineSteps = this.generators.concat(this.transforms)
    // populate with gens and xforms
    for (let set of this.ruleSets) {
      pipelineSteps = pipelineSteps.concat(set.allRules())
      pipelineSteps.push(set)
    }

    for (let step of pipelineSteps) {
      step.readInputs();
    }
  }
}

class PipelineStep {
  id;
  constructor() {
    this.id = util.getGid();
  }
  readInputs() {
    console.log('Superclass getting inputs for ' + this.id)
  }
  renderGenericInputs(elementId) {
    let ui = `<div class="step-buttons">
      <button onclick="stepUp(${this.id})">🔼</button>
      <button onclick="stepDown(${this.id})">🔽</button>
      <button onclick="removeStepGlobal(${this.id})">❎</button>
      </div>`;
    return ui;
  }
  setValues(v) {
  }
  readInput(attrib) {
    let inputEl = document.getElementById(this.id + '-' + attrib);
    if (inputEl != null) {
      let inputType = inputEl.type;
      if (inputType == 'number' || inputType == 'select-one') {
        let valstring = document.getElementById(this.id + '-' + attrib).value;
        if (isNaN(parseFloat(valstring))) { return valstring} else {return parseFloat(valstring)}
      }
      if (inputType == 'checkbox') return document.getElementById(this.id + '-' + attrib).checked;
    } else {
      return null;
    }
  }
}

/* Tidied this far */

class Generator extends PipelineStep {
  shape;
  attribs = {};

  // Call ctor with (Generator.patterns['grid'], Generator.shapes['hexagon']) or whatever
  // Or default ctor and set the fields
  constructor(pattern = 'grid', shape = 'square') {
    super()
    if (!(shape in Generator.shapes) || !(pattern in Generator.patterns)) {
      throw new Error('Invalid Generator option');
    }
    this.attributeChange('pattern', pattern)
    this.attributeChange('shape', shape)
  }
  static shapes = {
    'polygon': 
    {
      attribs: {
        'shapesides': 6
      },
      renderInput: function() {return `<div class="parameter"><label>Sides</label><input onchange="formInputChangeHandler()" id=${this.id + '-shapesides'} type="number" value=${this.attribs.shapesides} /></div>`},
      draw: function(p) {
        for (let i = 0; i < this.attribs.shapesides; i++) {
          let a = ((360 / this.attribs.shapesides) * (i - 0.5)) * Math.PI / 180;
          let rr = p.radius;
          p.points.push({
            x: p.centre.x + rr * Math.cos(a), y: p.centre.y + rr * Math.sin(a)
          })
          p.close = true;
        }
      }
    },
    'star': 
    {
      attribs: {
        'shapesides': 6
      },
      renderInput: function() {return `<div class="parameter"><label>Sides</label><input onchange="formInputChangeHandler()" id=${this.id + '-shapesides'} type="number" value=${this.attribs.shapesides} /></div>`},
      draw: function(p) {
        for (let i = 0; i < this.attribs.shapesides*2; i++) {
          let a = ((360 / (this.attribs.shapesides * 2)) * i) * Math.PI / 180;
          let rr = (i % 2 == 0 ? p.radius : p.radius * 0.5); // minor radius ratio
          p.points.push({
            x: p.centre.x + rr * Math.sin(a), y: p.centre.y - rr * Math.cos(a)
          })
          p.close = true;
        }
      }
    },    
    'square': {
      attribs: null,
      renderInput: null,
      draw: function(p) { 
        let rr = p.radius;
        for (let corner = 0; corner < 4; corner++) {
          p.points.push({
            x: p.centre.x + rr * (corner == 0 || corner == 3 ? 1 : -1), y: p.centre.y + rr * (corner < 2 ? 1 : -1)
          }) 
          p.close = true;
        }
      }
    },
    'arrow': {
      attribs: null,
      renderInput: null,
      draw: function(p) {
        p.points = [{x: p.centre.x, y: p.centre.y + p.radius}, 
                    {x: p.centre.x, y: p.centre.y - p.radius}, 
                    {x: p.centre.x + p.radius/2, y: p.centre.y - p.radius / 2}, 
                    {x: p.centre.x - p.radius/2, y: p.centre.y - p.radius / 2},
                    {x: p.centre.x, y: p.centre.y - p.radius}];
        p.close = false;
      }
    },
    'line': {
      attribs: null,
      renderInput: null,
      draw: function(p) {
        p.points = [{x: p.centre.x, y: p.centre.y + p.radius}, 
                    {x: p.centre.x, y: p.centre.y - p.radius}];
                    p.close = false;
      }
    },
    'circle': {
      attribs: null,
      renderInput: null,
      draw: function(p) {
        let count = 20;
        for (let c=0; c<count; c++) {
          p.points.push({
            x: p.centre.x + (p.radius * Math.sin(c * 6.2832 / count )),  y:p.centre.y + (p.radius * Math.cos(c * 6.2832 / count))
          }) 
        }
        p.close = true;
      }
    },
    'arc': {
      attribs: {
        'shapeangle': 270
      },
      renderInput: function() {return `<div class="parameter"><label>Angle</label><input onchange="formInputChangeHandler()" id=${this.id + '-shapeangle'} type="number" value=${this.attribs.shapeangle} /></div>`},
      draw: function(p) {
        let count = 20;
        let sides = Math.ceil((this.attribs.shapeangle * 20) / 360);
        for (let c=0; c<sides; c++) {
          p.points.push({
            x: p.centre.x + (p.radius * Math.sin(c * 6.2832 / count )),  y:p.centre.y + (p.radius * Math.cos(c * 6.2832 / count))
          }) 
        }
        p.close = false;
      }
    },
    'heart': {
      attribs: null,
      renderInput: null,
      draw: function(p) {
        const shapepoints = [[0, -0.5], [0.5, -1], [1, -1], [1.5, -0.5], [1.5, 0], [0, 1.5], [-1.5, 0], [-1.5, -0.5], [-1, -1], [-0.5, -1]];
        for (let sp of shapepoints) {
          p.points.push({x: p.centre.x + sp[0] * p.radius, y: p.centre.y + sp[1] * p.radius})
        }
        p.close = true;
      }
    },
  }  

  static patterns = {
    'staggeredgrid': {
      humanName: 'Hex grid',
      generatePoints: function generatePoints() {
        let g = [];
        for (let row = 0; row < this.attribs.rows; row++){ 
          for (let col = 0; col < this.attribs.cols; col++) {
            let x = this.attribs.origin_x + col * this.attribs.x_spacing + (row % 2 ? this.attribs.x_spacing / 2 : 0), y = this.attribs.origin_y + row * this.attribs.y_spacing;
            // push a shape with a centre and radius to g
            g.push({
              centre: {
                x, y
              }, radius: this.attribs.radius, points: []
            })
          }
        }
        return g
      }
    }, 
    'grid': {
      humanName: 'Grid',
      generatePoints: function generatePoints() {
        let g = [];
        for (let row = 0; row < this.attribs.rows; row++){ 
          for (let col = 0; col < this.attribs.cols; col++) {
            let x = this.attribs.origin_x + col * this.attribs.x_spacing, y = this.attribs.origin_y + row * this.attribs.y_spacing;

    'cols' : function() {return `<div class="parameter"><label>Cols</label><input onchange="formInputChangeHandler()" id=${this.id + '-cols'} type="number" value=${this.attribs.cols} /></div>`},
    'points' : function() {return `<div class="parameter"><label>Points</label><input onchange="formInputChangeHandler()" id=${this.id + '-points'} type="number" value=${this.attribs.points} /></div>`},
    'radius' : function() {return `<div class="parameter"><label>Size</label><input onchange="formInputChangeHandler()" id=${this.id + '-radius'} type="number" value=${this.attribs.radius} /></div>`},

    'y_spacing' : function() {return `<div class="parameter"><label>Y gap</label><input onchange="formInputChangeHandler()" id=${this.id + '-y_spacing'} type="number" value=${this.attribs.y_spacing} /></div>`},
    'origin_x' : function() {return `<div class="parameter"><label>${this.attribs.originXLabel}</label><div class="parameter-values"><input onchange="formInputChangeHandler()" id=${this.id + '-origin_x'} type="number" value=${this.attribs.origin_x} />`},

    'rndsign' : function() {return `↔ <input onchange="formInputChangeHandler()" id='${this.elementId}-rndsign' type='checkbox' ${this.attribs.rndsign ? 'checked' : ''} />`},
    'steps' : function() {return `📊 <input onchange="formInputChangeHandler()" id='${this.elementId}-steps' type=number value=${this.steps} ></div>`}
  }

      

  generateGeometry() {
    let g = this.generatePoints();
    for (const p of g) {
      p.points = [];
      this.shapefn(p)
    }
    return g
  }

  renderInputs() {
    // TODO: render attribute about the shape if we do parametric polygons/stars/whatever
    let ui = this.renderGenericInputs() + this.renderMap['pattern'].call(this) + this.renderMap['shape'].call(this);

    if (Generator.shapes[this.attribs.shape].attribs != null) {
      ui = ui + Generator.shapes[this.attribs.shape].renderInput.call(this);
    }

    let attribsToRender = this.attribsInPattern();
    for (let attribute in this.attribs) {
      if (attribsToRender.includes(attribute) && typeof this.renderMap[attribute] !== 'undefined') {
        ui = ui + this.renderMap[attribute].call(this)
      }
    }

    return ui;
  }

  readInputs() {
    for (let attribute in this.attribs) {
      // readInput takes the input name, constructs the DOM id ("42-rows") and reads the value according to HTML input type
      let newval = this.readInput(attribute);
      if (newval != null && newval != this.attribs[attribute]) {
        this.attributeChange(attribute, newval)
      }
    }
  }

  attributeChange(attribute, newval) {
    // Generic change attribute value first in case subsequent stuff relies on it (like fillDefaultAttribs)
    this.attribs[attribute] = newval;

    // Special cases
    if (attribute == 'shape') {
      this.shapefn = Generator.shapes[newval].draw;
      if (Generator.shapes[newval].attribs != null) {
        // add shape attribs to this.attribs if not already present, fill ssensible default
        for (let shapeAttrib in Generator.shapes[newval].attribs) {
          this.fillUndefinedAttrib(shapeAttrib, Generator.shapes[newval].attribs[shapeAttrib])
        }
      }
    }
    if (attribute == 'pattern') {
      this.generatePoints = Generator.patterns[newval].generatePoints;
      this.fillDefaultAttribs();
    }
  }

  fillDefaultAttribs() {
    // idiot proof init blocks
    for (let sensibleDefault in this.defaultVals['all']) {
      this.fillUndefinedAttrib(sensibleDefault, this.defaultVals['all'][sensibleDefault])
    }
    for (let set in this.defaultVals) {
      if (set.split(' ').includes(this.attribs.pattern)) {
        for (let sensibleDefault in this.defaultVals[set]) {
          this.fillUndefinedAttrib(sensibleDefault, this.defaultVals[set][sensibleDefault])
        }   
      }
    }
  }

  fillUndefinedAttrib(attribute, newval) {
    if (typeof this.attribs[attribute] == 'undefined') {
      this.attributeChange(attribute, newval)
    }
  }

  attribsInPattern() {
    for (let set in this.defaultVals) {
      if (set.split(' ').includes(this.attribs.pattern)) {
        return Object.keys(this.defaultVals['all']).concat(Object.keys(this.defaultVals[set]))
      }
    }
  }
}


// ValueField: return nuber based on coordinate and min/max value
// Transform: do a modify based on the value from a ValueField
// Rule: include or exclude shape based on whether the value from a ValueField falls within a limit
// TODO: add clipping bounds for Transforms (ie if the ValueField value is below 0, treat it as 0)

class ValueField {
  static #valueFields = {
    'constant': function value(attribs, point) {
      return attribs.max;
    },
    // TODO: deal with /0 if min_bound == max_bound
    // TODO: template these, big DRY win
    'X': function value(attribs, point) {
      let scalar_progress = (point.x-attribs.min_bound)/(attribs.max_bound-attribs.min_bound)
      return attribs.rule ? point.x : util.clamp(attribs.min, attribs.max, attribs.min + ((attribs.max - attribs.min) * scalar_progress))
    },
    'Y': function value(attribs, point) {
      let scalar_progress = (point.y-attribs.min_bound)/(attribs.max_bound-attribs.min_bound)
      return attribs.rule ? point.y : util.clamp(attribs.min, attribs.max, attribs.min + ((attribs.max - attribs.min) * scalar_progress))
    },
    'radius': function value(attribs, point) {
      let r = Math.hypot(point.x - attribs.centre_x, point.y - attribs.centre_y);
      let scalar_progress = (r-attribs.min_bound)/(attribs.max_bound-attribs.min_bound)
      return attribs.rule ? r : util.clamp(attribs.min, attribs.max, attribs.min + ((attribs.max - attribs.min) * scalar_progress))
    },
    'angle': function value(attribs, point) {
      let angle_degrees = util.angleFromTop(point.x - attribs.centre_x, point.y - attribs.centre_y);
      let scalar_progress = (angle_degrees-attribs.min_bound)/(attribs.max_bound-attribs.min_bound)
      return attribs.rule ? angle_degrees : attribs.min + (attribs.max - attribs.min) * ((angle_degrees / 360))
    },
    'manhattan': function value(attribs, point) {
      let r = Math.abs(point.x - attribs.centre_x) + Math.abs(point.y - attribs.centre_y)
      let scalar_progress = (r-attribs.min_bound)/(attribs.max_bound-attribs.min_bound)
      return attribs.rule ? r : util.clamp(attribs.min, attribs.max, attribs.min + ((attribs.max - attribs.min) * scalar_progress))      
    }
  }

  static getFieldTypes() {
    return Object.keys(ValueField.#valueFields)
  }

  static fieldfn(type) {
    return ValueField.#valueFields[type]
  }
}

// TRANSFORMS
class Transform extends PipelineStep {
  attribs = {};

  constructor(field, modify) {
    super()
    this.attribs.fieldType = field;
    this.attribs.modifyType = modify;

    this.attribs.rnd = false;
    this.attribs.rndsign = false;
    this.attribs.steps = 0;

    this.attributeChange('fieldType', field);
    this.attributeChange('modifyType', modify);
  }

  static #modifiers = {
    'scale': {
      humanName: "Scale",
      modify: function (shape, scalar) {
        // scale shape's points based on scalar
        for (let p of shape.points) {
          let dx = shape.centre.x - p.x
          dx = dx * scalar
          p.x = shape.centre.x - dx

          let dy = shape.centre.y - p.y
          dy = dy * scalar
          p.y = shape.centre.y - dy
        }
      }
    },
    'scale_x': {
      humanName: "Scale width",
      modify: function (shape, scalar) {
        // scale shape's points based on scalar
        for (let p of shape.points) {
          let dx = shape.centre.x - p.x
          dx = dx * scalar
          p.x = shape.centre.x - dx
        }
      }
    },
    'scale_y': {
      humanName: "Scale height",
      modify: function (shape, scalar) {
        // scale shape's points based on scalar
        for (let p of shape.points) {
          let dy = shape.centre.y - p.y
          dy = dy * scalar
          p.y = shape.centre.y - dy
        }
      }
    },
    'rotateinplace': {
      humanName:"Rotate in place",
      modify: function (shape, angle) {
        const angleRadians = angle * 0.0174533 // Math.PI / 180
        const centre = shape.centre;

        for (let point of shape.points) {  
          const dx = point.x - centre.x;
          const dy = point.y - centre.y;

          const cos = Math.cos(angleRadians);
          const sin = Math.sin(angleRadians);
          
          point.x = centre.x + dx * cos - dy * sin;
          point.y = centre.y + dx * sin + dy * cos
        }
      }   
    },
    'translatex': {
      humanName:"Move X",
      modify: function(shape, d) {
        // Move centre so subsequent rotates do rotate in place
        shape.centre.x = shape.centre.x + d
        for (let point of shape.points) {  
          point.x = point.x + d
        }        
      }
    },    
    'translatey': {
      humanName:"Move Y",
      modify: function (shape, d) {
        shape.centre.y = shape.centre.y + d
        for (let point of shape.points) {
          point.y = point.y + d
        }        
      }      
    },
  }

  static getModifierTypes() {
    return Object.keys(Transform.#modifiers)
  }

  randomise(value, point) {
    if ((this.attribs.rnd || this.attribs.rndsign) == false) return value;

    let lerpvalue = value;

    if (this.attribs.rnd) {
      // Seed the PRNG with the config random seed and the point's position
      let p = util.seededRand(point.x + ", " + point.y)

      // lerp between min and value based on rnd[0,1)
      // return ((value * p) + (this.attribs.baseValue * (1-p)))
      lerpvalue = ((value * p) + (this.attribs.min * (1-p)))
    }

    if (this.attribs.rndsign) {
      if (util.seededRand(point.x + " - " + point.y) < 0.5) {
        lerpvalue = 0-lerpvalue;
      }
    }

    return lerpvalue;
  }

  // Put value into one of n equally likely buckets between min and max inclusive
  discretise(value) {
    if (this.attribs.steps == 0) return value;
    if (this.attribs.max == this.attribs.min) return this.attribs.min;  // guard against /0
                                                                        // Lets pretend min = 5, max = 10 and steps = 3, p = 7
    let p = (value - this.attribs.min) / (this.attribs.max - this.attribs.min) // Normalise to [0-1] - gives us 0.4
    if (p>=1) p = 0.9999;                                               // Bound to [0,1) because if it's >1 or <0 it will overflow
    if (p<0) p = 0;
    p = p * this.attribs.steps                                          // Normalise to 0 to steps - gives us 1.2
    p = Math.trunc(p)                                                   // Round towards zero so negative effects work symmetrically with positive ones
    p = p / (this.attribs.steps - 1)                                    // Normalise back to [0,1) - gives us 0.5 as we're on middle step
    p = p * (this.attribs.max - this.attribs.min)                       // Normalise back to range extent - gives us 2.5
    p = p + this.attribs.min                                            // Move back up to actual range min-max - gives us 7.5

    return p;                                              // Return with the right sign
  }  

  value(point) {
    return this.discretise(this.randomise(ValueField.fieldfn(this.attribs.fieldType)(this.attribs, point), point))
  }  

  apply(g) {
    for (let p of g) {
      Transform.#modifiers[this.attribs.modifyType].modify(p, this.value(p.centre))
    }
  }

  renderMap = {
    'fieldType' : function() {
      let ui = `<div class="parameter"><label>using</label><select onchange="formInputChangeHandler()" id=${this.id + "-fieldType"}>`;
      for (let field of ValueField.getFieldTypes()) {
        ui = ui + `<option value=${field} ${field == this.attribs.fieldType ? ' selected' : ''}>${field}</option>`
      }
      ui = ui + '</select></div>'
      return ui;
    },
    'centre_x': function() {return ['manhattan', 'radius', 'angle'].includes(this.attribs.fieldType) ? `<div class="parameter"><label>about</label><div class="parameter-values"><input onchange="formInputChangeHandler()" id=${this.id + '-centre_x'} type="number" value=${this.attribs.centre_x} />` : ''},  
    'centre_y': function() {return ['manhattan', 'radius', 'angle'].includes(this.attribs.fieldType) ? `, <input onchange="formInputChangeHandler()" id=${this.id + '-centre_y'} type="number" value=${this.attribs.centre_y} /></div></div>` : ''},  
    'min_bound' : function() {return (this.attribs.fieldType != 'constant') ? `<div class="parameter"><label>Between</label><input onchange="formInputChangeHandler()" id=${this.id + '-min_bound'} type="number" value=${this.attribs.min_bound} /></div>` : ''},  
    'max_bound' : function() {return (this.attribs.fieldType != 'constant') ? `<div class="parameter"><label>and</label><input onchange="formInputChangeHandler()" id=${this.id + '-max_bound'} type="number" value=${this.attribs.max_bound} /></div>` : ''},  
    'min' : function() {return (this.attribs.fieldType != 'constant' || (this.attribs.rnd || this.attribs.rndsign)) ? `<div class="parameter"><label>From</label><input onchange="formInputChangeHandler()" id=${this.id + '-min'} type="number" value=${this.attribs.min} /></div>` : ''},  
    'max' : function() {return `<div class="parameter"><label>To</label><input onchange="formInputChangeHandler()" id=${this.id + '-max'} type="number" value=${this.attribs.max} /></div>`}, 
    'rnd': function(){return ''}, // done separately
    'rndsign': function(){return ''}, // done separately
    'steps': function(){return ''}, // done separately

  }

  renderInputs() {
    let ui = this.renderGenericInputs() + '<div class="parameter"><label>Xform</label><label>' + Transform.#modifiers[this.attribs.modifyType].humanName + '</label></div>'; // T\ODO: make this a select

    for (let attribute in this.attribs) {
      if (typeof this.renderMap[attribute] !== 'undefined') {
        ui = ui + this.renderMap[attribute].call(this)
      }
    }

    // check boxen for randon/bidirectional/steps
    ui = ui + `<div class="parameter checkbox-row"><label>🎲 <input onchange="formInputChangeHandler()" id='${this.id}-rnd' class="attrib-check" type='checkbox' ${this.attribs.rnd ? ' checked' : ''}/> 
                    ↔ <input onchange="formInputChangeHandler()" class="attrib-check" id='${this.id}-rndsign' type='checkbox' ${this.attribs.rndsign ? ' checked' : ''}/>
                    📊 <input onchange="formInputChangeHandler()" class="attrib-check" id='${this.id}-steps' type=number value=${this.attribs.steps}></label></div for="chexrow">`

    return ui
  }

  readInputs() {
    for (let attribute in this.attribs) {
      // readInput takes the input name, constructs the DOM id ("42-rows") and reads the value according to HTML input type
      let newval = this.readInput(attribute);
      if (newval != null && newval != this.attribs[attribute]) {
        this.attributeChange(attribute, newval)
      }
    }
  }

  attributeChange(attribute, newval) {
    // Special cases
    if (attribute == 'fieldType') {
      if (['manhattan', 'radius', 'angle'].includes(newval)) {
        if (typeof this.attribs.centre_x == 'undefined') {
          this.attribs.centre_x = 100
        }
        if (typeof this.attribs.centre_y == 'undefined') {
          this.attribs.centre_y = 100
        }
      }
      if (['manhattan', 'radius', 'angle'].includes(newval)) {
        if (typeof this.attribs.min_bound == 'undefined') {
          this.attribs.min_bound = 0
        }
        if (typeof this.max_bound == 'undefined') {
          this.attribs.max_bound = 100
        }
      }
      if (['X', 'Y'].includes(newval)) {
        if (typeof this.attribs.min_bound == 'undefined') {
          this.attribs.min_bound = 0
        }
        if (typeof this.max_bound == 'undefined') {
          this.attribs.max_bound = 200
        }        
      }
    }
    if (attribute == 'modifyType') {
      if (newval == 'rotateinplace') {
        this.attribs.min = 0;
        this.attribs.max = 90;
      } else if (['scale','scale_x','scale_y'].includes(newval)) {
        this.attribs.min = 1;
        this.attribs.max = 2;
      } else {
        this.attribs.min = 0;
        this.attribs.max = 10;
      }
    }

    // Generic change attribute value
    this.attribs[attribute] = newval;
  }
}


const RuleSet = class extends PipelineStep {
  colour;
  ruleGroups = [];
  constructor(colour = 'black') {
    super();
    this.colour = colour;
  }
  
  addGroup(g) {
    this.ruleGroups.push(g);
  }

  // return true if p satisfies ANY rule group
  classify(p) {
    // return true if there are no rules (default set)
    if (this.ruleGroups.length == 0) {
      return true;
    }
    for (const ruleGroup of this.ruleGroups) {
      if (ruleGroup.classify(p)) {
        return true;
      }
    }
    return false;
  }

  allRules() {
    let op = []
    for (let s of this.ruleGroups) {
      for (let r of s.rules) {
        op.push(r);
      }
    }
    return op
  }

  readInputs() {
    this.colour = document.querySelector('input[name="' + this.id + '-colour"]:checked').value;
  }
}

const RuleGroup = class extends PipelineStep {
  rules = []

  constructor() { super() }

  addRule(rule) {
    this.rules.push(rule)
  }

  // return true if p satisfies ALL rules
  classify(p) {
    for (const rule of this.rules) {
      if (!rule.classify(p)) {
        return false;
      }
    }
    return true;
  }
}

class Rule extends PipelineStep {
  attribs = {rule: true, fieldType:'', operator: '', bound: 0};
  constructor(fieldType = 'Y', operator = 'gt', bound = 100) {
    super()
    this.attributeChange('fieldType', fieldType);
    this.attributeChange('operator', operator);
    this.attributeChange('bound', bound);
  }

  classify(shape) {
    // attribs.rule means we get the plain value of the field without any clamping or lerping
    let pv = ValueField.fieldfn(this.attribs.fieldType)(this.attribs, shape.centre)
    return (this.attribs.operator == 'gt' ? pv > this.attribs.bound : pv < this.attribs.bound)
  }

  attributeChange(attribute, newval) {
    // Special cases
    if (attribute == 'fieldType') {
      if ( ['manhattan', 'radius', 'angle'].includes(newval) && !( ['manhattan', 'radius', 'angle'].includes(this.attribs.fieldType) ) ) {
        if (typeof this.attribs.centre_x == 'undefined') {
          this.attribs.centre_x = 100
        }
        if (typeof this.attribs.centre_y == 'undefined') {
          this.attribs.centre_y = 100
        }
      }
    }

    // Generic change attribute value
    this.attribs[attribute] = newval;
  }

  renderMap = {
    'fieldType' : function() {
      let ui = `<select onchange="formInputChangeHandler()" id=${this.id + "-fieldType"}>`;
      for (let field of ValueField.getFieldTypes()) {
        ui = ui + `<option onchange="formInputChangeHandler()" value=${field} ${field == this.attribs.fieldType ? ' selected' : ''}>${field}</option>`
      }
      ui = ui + '</select>'
      return ui;
    },    
    'operator' : function() {
      let ui = `<select onchange="formInputChangeHandler()" id=${this.id + "-operator"}>`;
      ui = ui + `<option value='gt' ${'gt' == this.attribs.operator ? ' selected' : ''}> &gt; </option>`
      ui = ui + `<option value='lt' ${'lt' == this.attribs.operator ? ' selected' : ''}> &lt; </option>`
      ui = ui + '</select>'

      return ui;
    },
    'bound': function() {return `<input onchange="formInputChangeHandler()" id='${this.id}-bound' type='number' value=${this.attribs.bound} />`},
    'centre_x': function() {return ['manhattan', 'radius', 'angle'].includes(this.attribs.fieldType) ? `<label>about <input onchange="formInputChangeHandler()" id=${this.id + '-centre_x'} type="number" value=${this.attribs.centre_x} />` : ''},  
    'centre_y': function() {return ['manhattan', 'radius', 'angle'].includes(this.attribs.fieldType) ? `, <input onchange="formInputChangeHandler()" id=${this.id + '-centre_y'} type="number" value=${this.attribs.centre_y} />` : ''},      
  }

  renderInputs() {
    // no up and down button for rules because order doesn't matter
    let ui = `<button class="step-button" style="float: right" onclick="removeStepGlobal(${this.id})">❎</button>`
    for (let attribute in this.attribs) {
      if (typeof this.renderMap[attribute] !== 'undefined') {
        ui = ui + this.renderMap[attribute].call(this)
      }
    }

    return ui;
  }
  readInputs() {
    for (let attribute in this.attribs) {
      // readInput takes the input name, constructs the DOM id ("42-rows") and reads the value according to HTML input type
      let newval = this.readInput(attribute);
      if (newval != null && newval != this.attribs[attribute]) {
        this.attributeChange(attribute, newval)
      }
    }
  }
}


let pipe = new Pipeline;
let defaultSet = new RuleSet();
defaultSet.colour = 'black'


let gen = new Generator('grid', 'star');

gen.attribs.radius = 5
gen.attribs.x_spacing = 10
gen.attribs.y_spacing = 10
gen.attribs.rows = 19
gen.attribs.cols = 12
gen.attribs.shapesides = 4

pipe.generators.push(gen)

let scaleall = new Transform('Y', 'scale')
scaleall.attribs.min = 1
scaleall.attribs.max = 1.4

let rotwiggle = new Transform('Y', 'rotateinplace')
rotwiggle.attribs.min = 0
rotwiggle.attribs.max = 45

for (xform of [scaleall, rotwiggle]) {
  xform.attribs.min_bound = 20;
  xform.attribs.max_bound = 180;
}

pipe.transforms.push(scaleall)
pipe.transforms.push(rotwiggle)

pipe.ruleSets.push(defaultSet)
config.pipelines.push(pipe)
config.activePipeline = config.pipelines[0]
for (let i=0; i<3; i++) {
  let newpipe = new Pipeline()
  newpipe.ruleSets.push(new RuleSet())
  config.pipelines.push(newpipe)
}

// Populate initial UI
let selectorui = '<select id="colour-select"><option value="all" selected>All</option>';
for (let col of config.colours) {
  selectorui = selectorui + `<option value="${col}">${col}</option>`;
}
selectorui = selectorui + '</select>'
document.getElementById('colour-selector').innerHTML = selectorui;

refresh()
</script>
