const util = {
  gid: 1,
  getGid: function() {
    return this.gid++;
  },

  // Seeded PRNG stuff
  cyrb128: function(str) {
    let h1 = 1779033703, h2 = 3144134277,
        h3 = 1013904242, h4 = 2773480762;
    for (let i = 0, k; i < str.length; i++) {
        k = str.charCodeAt(i);
        h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
        h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
        h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
        h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    h1 ^= (h2 ^ h3 ^ h4), h2 ^= h1, h3 ^= h1, h4 ^= h1;
    return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
  },
  sfc32: function(a, b, c, d) {
    a |= 0; b |= 0; c |= 0; d |= 0;
    let t = (a + b | 0) + d | 0;
    d = d + 1 | 0;
    a = b ^ b >>> 9;
    b = c + (c << 3) | 0;
    c = (c << 21 | c >>> 11);
    c = c + t | 0;
    return (t >>> 0) / 4294967296;
  },

  seededRand: function (salt) {
    // Use seeded
    // const seedgen = () => ((c.randomSeed + salt)*2**32)>>>0;
    const hashseed = this.cyrb128(config.randomSeed + salt) //  should have one seed per pipeline
    return this.sfc32(hashseed[0], hashseed[1], hashseed[2], hashseed[3]);
  },

  clamp: function(a, b, x) {
    let min = Math.min(a, b)
    let max = Math.max(a, b)

    return Math.min(max, Math.max(min, x))
  },

  clockDegrees: function(x, y) {
    let ex, ey, shift;
    if (x < 0 && y < 0) {
      ex = 0-x;
      ey = 0-y;
      shift = 180;
    }
    return Math.atan(ex, ey) // bollox
  },
  angleFromTop: function (x, y) {
    const angle = Math.atan2(x, -y) * 180 / Math.PI;
    return (angle + 360) % 360;
  },

  download: function (which) {
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([svgText(SVGbuilder.current, which)], {
      type: 'image/svg+xml'
    }));
    a.download = which + '.svg';
    a.click();
  },
}

  // Remit: ask pipelines for layers of geometry, consolidate the layers, make SVG text from that
  current: '',

  pathD: function (o) {
      return o.points.map((pt, i) => (i ? 'L' : 'M') + pt.x.toFixed(2) + ' ' + pt.y.toFixed(2)).join('') + (o.close ? 'Z' : '');
  },

  getLayers: function() {
    let outputLayers = {}
    for (pipeline of config.pipelines) {
      pipelineLayers = pipeline.getLayers()
      // TODO: Checc this gets the keys right
      for (layer in pipelineLayers) {
        if (layer in outputLayers) {
          outputLayers[layer] = outputLayers[layer].concat(pipelinLayers[layer])
        } else {
          outputLayers[layer] = [].concat(pipelineLayers[layer])
        }
      }
    }

    return outputLayers;
  },

  svgText: function (one) {
    const NS = "http://www.w3.org/2000/svg";
    let layers = this.getLayers();
    // TODO: de-Schlemiel this function
    let s = `<svg xmlns="${NS}" viewBox="0 0 200 200" width="200mm" height="200mm"><rect width="200" height="200" fill="white"/>`;

      }

class Pipeline {
  // Remit: have Pipelinesteps, build and read from pipeline ui, return layers of transformed geometry
  generators = []
  transforms = []
  ruleSets = []

  #generateGeometry() {
    let geometry = [] 
    for (const gen of this.generators) {
      geometry = [...geometry, ...gen.generateGeometry()]
    }

    return geometry;
  }

  #applyTransforms(g) {
    for (const transform of this.transforms) {
      transform.apply(g)
    }
    return g;
  }

  #assignLayers(g) {
    // put geometry into layers
    let L = {
    }; 

    // There can be multiple rule sets assigning to one colour
    // We treated them separately for calculating path colour, 
    // but now combine to one layer per colour for SVG output
    for (const ruleSet of this.ruleSets) {
      if (!(ruleSet.colour in L)) {
        L[ruleSet.colour] = []
      }
    }
    
    for (const p of g) {
      for (const ruleSet of this.ruleSets) {
        if (ruleSet.classify(p)) {
          L[ruleSet.colour].push(p);
          break;
        }
      }
    }
    return L;
  }

  getLayers() {
    // build the geometry, apply transforms, assign to layers following rules
    return this.#assignLayers(this.#applyTransforms(this.#generateGeometry()))
  }

  removeStep(elementId) {
    // Remove from DOM
    // document.getElementById(elementId + '-container').remove()

    let removed = false;

    // Remove from config
    for (let g in this.generators) {
      if (this.generators[g].id == elementId) {
        this.generators.splice(g, 1);
        removed = true;
        break;
      }
    }
    if (!removed) {
      for (let g in this.transforms) {
        if (this.transforms[g].id == elementId) {
          this.transforms.splice(g, 1);
          removed = true;
          break;
        }
      }
    }
    if (!removed) {
      for (let s in this.ruleSets) {
        if (this.ruleSets[s].id == elementId) {
          this.ruleSets.splice(s, 1)
          removed = true;
          break;
        }
      }
    }
    if (!removed) {
      for (let s in this.ruleSets) {
        for (let g in this.ruleSets[s].ruleGroups) {
          if (this.ruleSets[s].ruleGroups[g].id == elementId) {
            this.ruleSets[s].ruleGroups.splice(g, 1);
            removed = true;
            break;
          }
        }
      }
    }
    if (!removed) {
      for (let s in this.ruleSets) {
        for (let g in this.ruleSets[s].ruleGroups) {
          for (let r in this.ruleSets[s].ruleGroups[g].rules) {
            if (this.ruleSets[s].ruleGroups[g].rules[r].id == elementId) {
              this.ruleSets[s].ruleGroups[g].rules.splice(r, 1);
              removed = true;
              break;
            }
          }
        }
      }
    }    

    return removed;
  }


  buildUI() {
    let ui = ''
    ui = ui + '<div id="generators-ui" class="step-group">'
    for (let gen of this.generators) {
      ui = ui + '<div class="step-container" id="' + gen.elementId + '-container">' + gen.renderInputs() + '</div>'
    }

    ui = ui + '<button onclick="newGenerator()">New </button><select id="new-gen-type">'
    for (let gt in Generator.patterns) {
      ui = ui + `<option value=${gt}>${Generator.patterns[gt].humanName}</option>`
    }
    ui = ui + '</select></div>'

    
    ui = ui + '<div id="transforms-ui" class="step-group">'
    for (let xform of this.transforms) {
      ui = ui + '<div class="step-container" id="' + xform.elementId + '-container">' + xform.renderInputs() + '</div>'
    }
    
    ui = ui + '<button onclick="newTransform()">New </button><select id="new-xform-type">'
    for (let mt of Transform.getModifierTypes()) {
      ui = ui + `<option value=${mt}>${mt}</option>`
    }
    ui = ui + '</select></div>'
    

    ui = ui + '<div id="rules-ui" class="step-group">'
      
    
    for (let rs of this.ruleSets) {
      ui = ui + '<div class="rule-set"><p>Set'
      ui = ui + '<button style="float: right;" onclick="removeStepGlobal(\'' + rs.id + '\')">X</button></p>'
      for (let rg of rs.ruleGroups) {
        if (rg.rules.length > 1) {
          ui = ui + '<div class="rule-group"><p>Group'
          ui = ui + '<button style="float: right;" onclick="removeStepGlobal(\'' + rg.id + '\')">X</button></p>'
        }
        for (let r of rg.rules) {
          // TODO: generic X remove button here
          ui = ui + '<div class="rule-element">' + r.renderInputs() + '</div>'
        }
        ui = ui + '</div>'
      }

      // colour picker
      ui = ui + `<select id="${rs.id}-colour" style="background-color: ${rs.colour}">`
      for (let col of ['black', 'red', 'green', 'blue', 'purple']) {
        ui = ui + `<option style="background-color: ${col}" >.</option>`; // ${rs.colour == col ? 'selected' : ''}
      }
      ui = ui + '</select>'

      // ui = ui + '<div class="colour-block" style="background-color: ' + rs.colour + '"></div>'
    }
      
    ui = ui + '</div>'

    return ui;
  }

  updateSteps() {
    // Update all the setup of the pipeline from the active UI
    let pipelineSteps = this.generators.concat(this.transforms)
    // populate with gens and xforms
    for (let set of this.ruleSets) {
      pipelineSteps = pipelineSteps.concat(set.allRules())
      pipelineSteps.push(set)
    }

    for (let step of pipelineSteps) {
      step.readInputs();
    }
  }

  // Everything below NEW PIPELINESTEP FUNCTIONS should be here, bring in PipelineStep class definitions next
}

class Generator extends PipelineStep {
  shape; // TODO: Ever used?
  attribs = {};

  // Call ctor with (Generator.patterns['grid'], Generator.shapes['hexagon']) or whatever
  // Or default ctor and set the fields
  constructor(pattern = 'grid', shape = 'square') {
    super()
    if (!(shape in Generator.shapes) || !(pattern in Generator.patterns)) {
      throw new Error('Invalid Generator option');
    }
    this.attribs.shape = shape;
    this.shapefn = Generator.shapes[shape];
    this.pattern = pattern;
    this.generatePoints = Generator.patterns[this.pattern].generatePoints; // this binding
    
    // idiot proof init blocks
    this.attribs.radius = 5; // every shape needs a radius
    

    if (pattern == 'grid' || pattern == 'staggeredgrid') {
      this.attribs.rows = 10;
      this.attribs.cols = 10;
      this.attribs.x_spacing = 20;
      this.attribs.y_spacing = 20;
      this.attribs.origin_x = 10;
      this.attribs.origin_y = 10;
      this.attribs.originXLabel = 'Start at';
    } else if (pattern == 'circle') {
      // ...
      this.attribs.points = 12;
      this.attribs.origin_x = 100;
      this.attribs.origin_y = 100;
      this.attribs.originXLabel = 'Centre';
    }
    // this.attribs.rnd = false;
    // this.attribs.rndsign = false;
    // this.attribs.steps = 0;
  }
  static shapes = {
    'hexagon': function(p) {
      for (let i = 0; i < 6; i++) {
        let a = (60 * i - 30) * Math.PI / 180;
        let rr = p.radius;
        p.points.push({
          x: p.centre.x + rr * Math.cos(a), y: p.centre.y + rr * Math.sin(a)
        })
        p.close = true;
      }
    },
    'square': function(p) {
      let rr = p.radius;
      for (let corner = 0; corner < 4; corner++) {
        p.points.push({
          x: p.centre.x + rr * (corner == 0 || corner == 3 ? 1 : -1), y: p.centre.y + rr * (corner < 2 ? 1 : -1)
        }) 
        p.close = true;
      }
    },
    'arrow': function(p) {
      p.points = [{x: p.centre.x, y: p.centre.y + p.radius}, 
                  {x: p.centre.x, y: p.centre.y - p.radius}, 
                  {x: p.centre.x + p.radius/2, y: p.centre.y - p.radius / 2}, 
                  {x: p.centre.x - p.radius/2, y: p.centre.y - p.radius / 2},
                  {x: p.centre.x, y: p.centre.y - p.radius}];
      p.close = false;
    }
  }  

  static patterns = {
    'staggeredgrid': {
      humanName: 'Hex grid',
      generatePoints: function generatePoints() {
        let g = [];
        for (let row = 0; row < this.attribs.rows; row++){ 
          for (let col = 0; col < this.attribs.cols; col++) {
            let x = this.attribs.origin_x + col * this.attribs.x_spacing + (row % 2 ? this.attribs.x_spacing / 2 : 0), y = this.attribs.origin_y + row * this.attribs.y_spacing;
            // push a shape with a centre and radius to g
            g.push({
              centre: {
                x, y
              }, radius: this.attribs.radius, angle: 0, points: []
            })
          }
        }
        return g
      }
    }, 
    'grid': {
      humanName: 'Grid',
      generatePoints: function generatePoints() {
        let g = [];
        for (let row = 0; row < this.attribs.rows; row++){ 
          for (let col = 0; col < this.attribs.cols; col++) {
            let x = this.attribs.origin_x + col * this.attribs.x_spacing, y = this.attribs.origin_y + row * this.attribs.y_spacing;
            // push a shape with a centre and radius to g
            g.push({
              centre: {
                x, y
              }, radius: this.attribs.radius, angle: 0, points: []
            })
          }
        }
        return g
      }
    }
  }

  renderMap = {
    'shape' : function() {
      let ui = `<select id=${this.id + "-shape"}>`;
      for (let shape in Generator.shapes) {
        ui = ui + `<option value=${shape} ${shape == this.attribs.shape ? ' selected' : ''}>${shape}</option>`
      }
      ui = ui + '</select>'
      return ui;
    },
    'rows' : function() {return `<label>Rows<input id=${this.id + '-rows'} type="number" value=${this.attribs.rows} /></label>`},
    'cols' : function() {return `<label>Cols<input id=${this.id + '-cols'} type="number" value=${this.attribs.cols} /></label>`},
    'radius' : function() {return `<label>Size<input id=${this.id + '-radius'} type="number" value=${this.attribs.radius} /></label>`},
    'x_spacing' : function() {return `<label>X gap<input id=${this.id + '-x_spacing'} type="number" value=${this.attribs.x_spacing} /></label>`},
    'y_spacing' : function() {return `<label>Y gap<input id=${this.id + '-y_spacing'} type="number" value=${this.attribs.y_spacing} /></label>`},
    'origin_x' : function() {return `<label>${this.attribs.originXLabel}<input id=${this.id + '-origin_x'} type="number" value=${this.attribs.origin_x} />`},
    'origin_y' : function() {return `, <input id=${this.id + '-origin_y'} type="number" value=${this.attribs.origin_y}></label>`},
    // TODO: make these self contained divs with a class making them inline-block or whatever
    'rnd' : function() {return `<label>🎲 <input id='${this.elementId}-rnd' type='checkbox' ${this.attribs.rnd ? ' checked' : ''} />`}, 
    'rndsign' : function() {return `↔ <input id='${this.elementId}-rndsign' type='checkbox' ${this.attribs.rndsign ? 'checked' : ''} />`},
    'steps' : function() {return `📊 <input id='${this.elementId}-steps' type=number value=${this.steps} >`}
  }

      

  generateGeometry() {
    let g = this.generatePoints(); // this binding
    for (const p of g) {
      // for each shape in the geometry,
      // populate a list of points
      p.points = [];
      this.shapefn(p)
    }
    return g
  }

  renderInputs() {
    let ui = this.renderGenericInputs() + '<label>' + Generator.patterns[this.pattern].humanName + '</label>';
    for (let attribute in this.attribs) {
      if (typeof this.renderMap[attribute] !== 'undefined') {
        ui = ui + this.renderMap[attribute].call(this)
      }
    }

    return ui;
  }

  readInputs() {
    for (let attribute in this.attribs) {
      // readInput takes the input name, constructs the DOM id ("42-rows") and reads the value according to HTML input type
      let newval = this.readInput(attribute);
      if (newval != null && newval != this.attribs[attribute]) {
        this.attributeChange(attribute, newval)
      }
    }
  }

  attributeChange(attribute, newval) {
    // Special cases
    if (attribute == 'shape') {
      this.shapefn = Generator.shapes[newval]
    }

    // Generic change attribute value
    this.attribs[attribute] = newval;
  }
}


// ValueField: return nuber based on coordinate and min/max value
// Transform: do a modify based on the value from a ValueField
// Rule: include or exclude shape based on whether the value from a ValueField falls within a limit
// TODO: add clipping bounds for Transforms (ie if the ValueField value is below 0, treat it as 0)

class ValueField {
  static #valueFields = {
    'X': function value(attribs, point) {
      return attribs.rule ? point.x : attribs.min + ((attribs.max - attribs.min) * point.x / config.doc.w)
    },
    'Y': function value(attribs, point) {
      return attribs.rule ? point.y : attribs.min + ((attribs.max - attribs.min) * point.y / config.doc.h)
    },
    'radius': function value(attribs, point) {
      let r = Math.hypot(point.x - attribs.centre_x, point.y - attribs.centre_y);
      return attribs.rule ? r : util.clamp(attribs.min, attribs.max, r / attribs.radius )
    },
    'angle': function value(attribs, point) {
      let angle_degrees = util.angleFromTop(point.x - attribs.centre_x, point.y - attribs.centre_y);
      return attribs.rule ? angle_degrees : attribs.min + (attribs.max - attribs.min) * ((angle_degrees / 360))
    }
  }

  static getFieldTypes() {
    return Object.keys(ValueField.#valueFields)
  }

  static fieldfn(type) {
    return ValueField.#valueFields[type]
  }
}

// TRANSFORMS
class Transform extends PipelineStep {
  attribs = {};

  constructor(field, modify) {
    super()
    this.attribs.fieldType = field;
    this.attribs.modifyType = modify;

    this.attribs.rnd = false;
    this.attribs.rndsign = false;
    this.attribs.steps = 0;

    this.attributeChange('modifyType', modify); // should do this more consistently
  }

  static #modifiers = {
    'scale': {
      humanName: "Scale",
      modify: function (shape, scalar) {
        // scale shape's points based on scalar
        for (let p of shape.points) {
          let dx = shape.centre.x - p.x
          dx = dx * scalar
          p.x = shape.centre.x - dx

          let dy = shape.centre.y - p.y
          dy = dy * scalar
          p.y = shape.centre.y - dy
        }
      }
      
    },
    'rotateinplace': {
      humanName:"Rotate in place",
      modify: function (shape, angle) {
        const angleRadians = angle * 0.0174533 // Math.PI / 180
        const centre = shape.centre;

        for (let point of shape.points) {  
          const dx = point.x - centre.x;
          const dy = point.y - centre.y;

          const cos = Math.cos(angleRadians);
          const sin = Math.sin(angleRadians);
          
          point.x = centre.x + dx * cos - dy * sin;
          point.y = centre.y + dx * sin + dy * cos
        }
      }   
    },
    'translatex': {
      humanName:"Move X",
      modify: function(shape, d) {
        // Move centre so subsequent rotates do rotate in place
        shape.centre.x = shape.centre.x + d
        for (let point of shape.points) {  
          point.x = point.x + d
        }        
      }
    },    
    'translatey': {
      humanName:"Move Y",
      modify: function (shape, d) {
        shape.centre.y = shape.centre.y + d
        for (let point of shape.points) {
          point.y = point.y + d
        }        
      }      
    },
  }

  static getModifierTypes() {
    return Object.keys(Transform.#modifiers)
  }

  randomise(value, point) {
    if (this.attribs.rnd == false) return value;

    // Seed the PRNG with the config random seed and the point's position
    let p = util.seededRand(point.x + ", " + point.y)

    if (this.attribs.rndsign) {
      if (util.seededRand(point.x + " - " + point.y) < 0.5) {
        p = 0-p;
      }
    }

    // lerp between baseValue and value based on rnd[0,1)
    return ((value * p) + (this.attribs.baseValue * (1-p)))
  }

  // Put value into one of n equally likely buckets between min and max inclusive
  discretise(value) {
    if (this.attribs.steps == 0) return value;
    if (this.attribs.max == this.attribs.min) return this.attribs.min; // guard against /0
    // Lets pretend min = 5, max = 10 and steps = 3, p = 7
    let p = (value - this.attribs.min) / (this.attribs.max - this.attribs.min) // Normalise to 0 to 1 - gives us 0.4
    p = p * this.attribs.steps                                 // Normalise to 0 to steps - gives us 1.2
    p = Math.floor(p)                                  // Round down 0, 1, ... (steps - 1) - gives us 1
    p = p / (this.attribs.steps - 1)                           // Normalise back to [0,1) - gives us 0.5 as we're on middle step
    p = p * (this.attribs.max - this.attribs.min)                      // Normalise back to range extent - gives us 2.5
    p = p + this.attribs.min                                   // Move back up to actual range min-max - gives us 7.5

    return p;
  }  

  value(point) {
    return this.discretise(this.randomise(ValueField.fieldfn(this.attribs.fieldType)(this.attribs, point), point))
  }  

  apply(g) {
    for (let p of g) {
      Transform.#modifiers[this.attribs.modifyType].modify(p, this.value(p.centre))
    }
  }

  renderMap = {
    'fieldType' : function() {
      let ui = `<select id=${this.id + "-fieldType"}>`;
      for (let field of ValueField.getFieldTypes()) {
        ui = ui + `<option value=${field} ${field == this.attribs.fieldType ? ' selected' : ''}>${field}</option>`
      }
      ui = ui + '</select>'
      return ui;
    },
    'centre_x': function() {return ['radius', 'angle'].includes(this.attribs.fieldType) ? `<label>about <input id=${this.id + '-centre_x'} type="number" value=${this.attribs.centre_x} />` : ''},  
    'centre_y': function() {return ['radius', 'angle'].includes(this.attribs.fieldType) ? `, <input id=${this.id + '-centre_y'} type="number" value=${this.attribs.centre_y} />` : ''},  
    'min' : function() {return `<label>From<input id=${this.id + '-min'} type="number" value=${this.attribs.min} /></label>`},  
    'max' : function() {return `<label>To <input id=${this.id + '-max'} type="number" value=${this.attribs.max} /></label>`}, 
    'rnd': function(){return ''}, // done separately
    'rndsign': function(){return ''}, // done separately
    'steps': function(){return ''}, // done separately

  }

  renderInputs() {
    let ui = this.renderGenericInputs() + Transform.#modifiers[this.attribs.modifyType].humanName + ' using ';

    for (let attribute in this.attribs) {
      if (typeof this.renderMap[attribute] !== 'undefined') {
        ui = ui + this.renderMap[attribute].call(this)
      }
    }

    // check boxen for randon/bidirectional/steps
    ui = ui + `<label>🎲 <input id='${this.id}-rnd' type='checkbox' ${this.attribs.rnd ? ' checked' : ''}/> 
                    ↔ <input id='${this.id}-rndsign' type='checkbox' ${this.attribs.rndsign ? ' checked' : ''}/>
                    📊 <input id='${this.id}-steps' type=number value=${this.attribs.steps}>`

    return ui
  }

  readInputs() {
    for (let attribute in this.attribs) {
      // readInput takes the input name, constructs the DOM id ("42-rows") and reads the value according to HTML input type
      let newval = this.readInput(attribute);
      if (newval != null && newval != this.attribs[attribute]) {
        this.attributeChange(attribute, newval)
      }
    }
  }

  attributeChange(attribute, newval) {
    // Special cases
    if (attribute == 'fieldType') {
      if (['radius', 'angle'].includes(newval)) {
        if (typeof this.attribs.centre_x == 'undefined') {
          this.attribs.centre_x = 100
        }
        if (typeof this.attribs.centre_y == 'undefined') {
          this.attribs.centre_y = 100
        }
      }
      if (newval == 'radius') {
        if (typeof this.attribs.radius == 'undefined') {
          this.attribs.radius = 50
        }
      }
    }
    if (attribute == 'modifyType') {
      if (newval == 'rotateinplace') {
        this.attribs.min = 0;
        this.attribs.max = 90;
        this.attribs.baseValue = 0;
      } else if (newval == 'scale') {
        this.attribs.min = 1;
        this.attribs.max = 2;
        this.attribs.baseValue = 1;
      } else {
        this.attribs.min = 0;
        this.attribs.max = 10;
        this.attribs.baseValue = 0; 
      }
    }

    // Generic change attribute value
    this.attribs[attribute] = newval;
  }
}


const RuleSet = class extends PipelineStep {
  colour;
  ruleGroups = [];
  constructor() {
    super();
  }
  
  addGroup(g) {
    this.ruleGroups.push(g);
  }

  // return true if p satisfies ANY rule group
  classify(p) {
    // return true if there are no rules (default set)
    if (this.ruleGroups.length == 0) {
      return true;
    }
    for (const ruleGroup of this.ruleGroups) {
      if (ruleGroup.classify(p)) {
        return true;
      }
    }
    return false;
  }

  allRules() {
    let op = []
    for (let s of this.ruleGroups) {
      for (let r of s.rules) {
        op.push(r);
      }
    }
    return op
  }

  readInputs() {
    // Pretty simple
    this.colour = this.readInput('colour')
  }
}

const RuleGroup = class extends PipelineStep {
  rules = []

  constructor() { super() }

  addRule(rule) {
    this.rules.push(rule)
  }

  // return true if p satisfies ALL rules
  classify(p) {
    for (const rule of this.rules) {
      if (!rule.classify(p)) {
        return false;
      }
    }
    return true;
  }
}

class Rule extends PipelineStep {
  attribs = {rule: true, fieldType:'', operator: '', bound: 0};
  constructor(fieldType = 'Y', operator = 'gt', bound = 100) {
    super()
    this.attributeChange('fieldType', fieldType);
    this.attributeChange('operator', operator);
    this.attributeChange('bound', bound);
  }

  classify(shape) {
    // TODO: this is wrong, I want the position as a scalar
    // Need "one to one" fields ie mapping X from 0 to doc.width, etc.
    let pv = ValueField.fieldfn(this.attribs.fieldType)(this.attribs, shape.centre)
    return (this.attribs.operator == 'gt' ? pv > this.attribs.bound : pv < this.attribs.bound)
  }

  attributeChange(attribute, newval) {
    // Special cases
    if (attribute == 'fieldType') {
      if (['radius', 'angle'].includes(newval)) {
        if (typeof this.attribs.centre_x == 'undefined') {
          this.attribs.centre_x = 100
        }
        if (typeof this.attribs.centre_y == 'undefined') {
          this.attribs.centre_y = 100
        }
      }
    }

    // Generic change attribute value
    this.attribs[attribute] = newval;
  }

  renderMap = {
    'fieldType' : function() {
      let ui = `<select id=${this.id + "-fieldType"}>`;
      for (let field of ValueField.getFieldTypes()) {
        ui = ui + `<option value=${field} ${field == this.attribs.fieldType ? ' selected' : ''}>${field}</option>`
      }
      ui = ui + '</select>'
      return ui;
    },    
    'operator' : function() {
      let ui = `<select id=${this.id + "-operator"}>`;
      ui = ui + `<option value='gt' ${'gt' == this.attribs.operator ? ' selected' : ''}> &gt; </option>`
      ui = ui + `<option value='lt' ${'lt' == this.attribs.operator ? ' selected' : ''}> &lt; </option>`
      ui = ui + '</select>'

      return ui;
    },
    'bound': function() {return `<input id='${this.id}-bound' type='number' value=${this.attribs.bound} />`},
    'centre_x': function() {return ['radius', 'angle'].includes(this.attribs.fieldType) ? `<label>about <input id=${this.id + '-centre_x'} type="number" value=${this.attribs.centre_x} />` : ''},  
    'centre_y': function() {return ['radius', 'angle'].includes(this.attribs.fieldType) ? `, <input id=${this.id + '-centre_y'} type="number" value=${this.attribs.centre_y} />` : ''},      
  }

  renderInputs() {
    let ui = this.renderGenericInputs(this.elementId);

    for (let attribute in this.attribs) {
      if (typeof this.renderMap[attribute] !== 'undefined') {
        ui = ui + this.renderMap[attribute].call(this)
      }
    }

    return ui;
  }
  readInputs() {
    for (let attribute in this.attribs) {
      // readInput takes the input name, constructs the DOM id ("42-rows") and reads the value according to HTML input type
      let newval = this.readInput(attribute);
      if (newval != null && newval != this.attribs[attribute]) {
        this.attributeChange(attribute, newval)
      }
    }
  }
}
